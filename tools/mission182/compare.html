<!doctype html>
<meta charset="utf-8"><title>Mission 182A coexistence compare (QA only, local)</title>
<style>html,body{margin:0}#c{width:1280px;height:800px}</style>
<div id="c"></div><pre id="result">pending</pre>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.1/Build/Cesium/Widgets/widgets.css">
<style>#c canvas{width:100%;height:100%;display:block}</style>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.1/Build/Cesium/Cesium.js"></script>
<script>
// ?ref=/A/tileset.json (camera only, hidden)  &ts=/B/tileset.json,/S/tileset.json (shown)
(async () => {
  const out = { jsErrors: [], status: 'loading' };
  window.addEventListener('error', (e) => out.jsErrors.push(String(e.message)));
  try {
    const q = new URLSearchParams(location.search);
    const viewer = new Cesium.Viewer('c', { baseLayer: false, baseLayerPicker: false, geocoder: false, animation: false, timeline: false, requestRenderMode: false, contextOptions: { webgl: { preserveDrawingBuffer: true } } });
    const ref = await Cesium.Cesium3DTileset.fromUrl(q.get('ref'));
    const bs = ref.boundingSphere; // never added to the scene: used only for an identical camera in every view
    const list = (q.get('ts') || '').split(',').filter(Boolean);
    const sets = [];
    let vis = 0, load = 0;
    for (const u of list) {
      const t = await Cesium.Cesium3DTileset.fromUrl(u);
      t.tileVisible.addEventListener(() => { vis++; });
      t.tileLoad.addEventListener(() => { load++; });
      viewer.scene.primitives.add(t); sets.push(t);
    }
    viewer.camera.viewBoundingSphere(bs, new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-45), bs.radius * 1.5));
    viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    let maxTri = 0, maxSel = 0;
    const rm = viewer.scene.postRender.addEventListener(() => {
      let tri = 0, sel = 0;
      for (const t of sets) { const st = (t._statisticsPerPass && t._statisticsPerPass[0]) || t.statistics; if (st) { tri += st.numberOfTrianglesSelected || 0; sel += st.selected || 0; } }
      if (tri > maxTri) maxTri = tri; if (sel > maxSel) maxSel = sel;
    });
    const t0 = performance.now();
    for (let i = 0; i < 60; i++) {
      viewer.scene.render(); await new Promise((r) => setTimeout(r, 100));
      if (i > 15 && sets.every((t) => t.tilesLoaded) || performance.now() - t0 > 25000) break;
    }
    for (let i = 0; i < 10; i++) { viewer.scene.render(); await new Promise((r) => setTimeout(r, 100)); }
    rm();
    // downsample to 640x400 RGB, base64, so Node can diff views across separate runs
    const c = viewer.canvas, t = document.createElement('canvas'); t.width = 640; t.height = 400;
    t.getContext('2d').drawImage(c, 0, 0, 640, 400);
    const d = t.getContext('2d').getImageData(0, 0, 640, 400).data;
    const rgb = new Uint8Array(640 * 400 * 3);
    for (let i = 0, j = 0; i < d.length; i += 4) { rgb[j++] = d[i]; rgb[j++] = d[i + 1]; rgb[j++] = d[i + 2]; }
    let s = ''; for (let i = 0; i < rgb.length; i += 8192) s += String.fromCharCode.apply(null, rgb.subarray(i, i + 8192));
    out.rgb64 = btoa(s);
    out.tileLoadEvents = load; out.tileVisibleEvents = vis; out.maxTrianglesSelected = maxTri; out.maxSelectedTiles = maxSel;
    out.allLoaded = sets.every((x) => x.tilesLoaded); out.sets = list.length;
    out.status = 'ok';
  } catch (e) { out.status = 'error'; out.error = String(e && e.message || e); }
  document.getElementById('result').textContent = JSON.stringify(out); document.title = 'DONE';
})();
</script>
