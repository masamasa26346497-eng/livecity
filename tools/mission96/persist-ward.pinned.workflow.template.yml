# Mission 96: INSTALL BY OWNER as .github/workflows/mission95-persist-ward.yml on the default branch
# (replaces the Mission95 version; Claude's GitHub App cannot write .github/workflows).
# GENERATED from persist-ward.pinned.workflow.template.yml by `node tools/mission96/pin-audit.mjs render`. Do not hand-edit hashes.
#
# Why this exists: the default branch lacks tools/mission80-batch.mjs, tools/mission95-persist-ward.mjs, etc.
# This workflow therefore checks out ONE audited commit by full SHA (never a branch tip) and refuses to run unless
# (a) HEAD == pinned SHA, (b) the tree is clean, (c) every executed file matches the sha256 embedded below IN THIS
# (trusted, main-resident) workflow file. The token is exposed only to the read-only connect check (curl, no repo code)
# and the single persist step, which re-verifies hashes right before it runs.
# Owner-only: workflow_dispatch, actor == repository owner, run on the default branch. Initial scope: ward nishi only.
name: Mission95 persist ward to private repo
on:
  workflow_dispatch:
    inputs:
      ward:
        description: ward id (initial run is nishi only)
        required: true
        type: choice
        default: nishi
        options:
          - nishi
permissions:
  contents: read
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.actor == github.repository_owner && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    env:
      PIN_SHA: "@@PIN_SHA@@"
      DATA_REPO: masamasa26346497-eng/livecity-3d-data
      WARD: ${{ inputs.ward }}
    steps:
      - name: Checkout pinned audited commit
        uses: actions/checkout@v4
        with:
          ref: "@@PIN_SHA@@"
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write trusted hash list (from this workflow file)
        run: |
          cat > "$RUNNER_TEMP/pin.sha256" <<'HASHES'
@@HASHES@@
          HASHES
          sed -i 's/^ *//' "$RUNNER_TEMP/pin.sha256"
          wc -l "$RUNNER_TEMP/pin.sha256"
      - name: Verify pinned SHA, clean tree, file hashes (no token)
        run: |
          set -eu
          [ "$(git rev-parse HEAD)" = "$PIN_SHA" ] || { echo "FAIL: HEAD is not the pinned SHA"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "FAIL: tree not clean"; exit 1; }
          sha256sum -c "$RUNNER_TEMP/pin.sha256"
          echo "OK: pinned code verified"
      - name: Preflight (no token, no network)
        run: |
          set -eu
          [ "$WARD" = "nishi" ] || { echo "FAIL: only nishi is allowed in the initial run"; exit 1; }
          [ "$DATA_REPO" = "masamasa26346497-eng/livecity-3d-data" ] || { echo "FAIL: unexpected data repo"; exit 1; }
          node -e '
            const fs=require("fs"); const w=process.env.WARD;
            const polys=JSON.parse(fs.readFileSync("data/processed/osaka-city/boundaries/ward-classification-polygons.json","utf8"));
            const hit=polys.wards.find(x=>x.wardId===w);
            if(!hit) throw new Error("ward not in N03 polygons: "+w);
            if(String(hit.wardCode).startsWith("27999")) throw new Error("expo (27999) excluded");
            const lock=JSON.parse(fs.readFileSync("data/reports/mission79/source-lock.json","utf8"));
            if(!/plateau-27100-osaka-shi-2025/.test(JSON.stringify(lock.package))) throw new Error("source lock is not 27100/2025");
            if(!lock.license||!lock.attribution) throw new Error("license/attribution missing in source lock");
            const codes=new Set(polys.wards.map(x=>String(x.wardCode))); if(codes.size!==polys.wards.length) throw new Error("duplicate ward codes");
            console.log("preflight ok ward="+w+" code="+hit.wardCode+" cost=0 (public CDN range reads, free runner minutes, private repo release)");
          '
      - name: Connect check (read-only, curl only, no repo code)
        env:
          DATA_TOKEN: ${{ secrets.LIVECITY_3D_DATA_TOKEN }}
        run: |
          set -u
          if [ -z "$DATA_TOKEN" ]; then echo "FAIL: secret empty or missing"; exit 1; fi
          echo "::add-mask::$DATA_TOKEN"
          code=$(curl -sS -o /tmp/repo.json -w '%{http_code}' -H "Authorization: Bearer $DATA_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$DATA_REPO")
          [ "$code" = "200" ] || { echo "FAIL: repo GET HTTP $code"; exit 1; }
          vis=$(jq -r '.visibility' /tmp/repo.json); push=$(jq -r '.permissions.push // false' /tmp/repo.json)
          echo "repo=$DATA_REPO visibility=$vis token_push=$push"
          [ "$vis" = "private" ] && [ "$push" = "true" ] || { echo "FAIL: need private + push"; exit 1; }
          echo "OK: private connection verified (read-only)"
      - name: Convert ward (PLATEAU 2025, NO token)
        run: node tools/mission80-batch.mjs --wards "$WARD" --max-wards 1 --ward-timeout-min 60
      - name: Strict output check (no token)
        run: node tools/mission95-check-output.mjs "$WARD"
      - name: Re-verify code hashes before token use (no token)
        run: |
          set -eu
          [ "$(git rev-parse HEAD)" = "$PIN_SHA" ] || { echo "FAIL: HEAD changed"; exit 1; }
          sha256sum -c "$RUNNER_TEMP/pin.sha256"
          # batch-manifest.json is TRACKED and rewritten by the convert step (Mission98 root cause: " M" was rejected).
          # Allow exactly: untracked temp/ + data/reports/mission80/, and a modification of that ONE manifest file
          # whose content is verified below against the committed version. Anything else fails.
          M=data/reports/mission80/batch-manifest.json
          bad=$(git status --porcelain | grep -vE '^\?\? (temp/|data/reports/mission80/)' | grep -vE "^ M $M\$" || true)
          [ -z "$bad" ] || { echo "FAIL: unexpected changes: $bad"; exit 1; }
          git show "HEAD:$M" > "$RUNNER_TEMP/manifest.head.json"
          MANIFEST_BASE="$RUNNER_TEMP/manifest.head.json" MANIFEST_NEW="$M" node -e '
            const fs=require("fs"); const w=process.env.WARD;
            const a=JSON.parse(fs.readFileSync(process.env.MANIFEST_BASE,"utf8")), b=JSON.parse(fs.readFileSync(process.env.MANIFEST_NEW,"utf8"));
            const same=(x,y)=>JSON.stringify(x)===JSON.stringify(y);
            if(b.mission!==a.mission||String(b.vintage)!==String(a.vintage)) throw new Error("manifest header changed");
            for(const k of Object.keys(a.wards||{})){ if(k!==w && !same(a.wards[k],b.wards[k])) throw new Error("other ward entry modified: "+k); }
            for(const k of Object.keys(b.wards||{})){ if(k!==w && !(k in a.wards)) throw new Error("unexpected new ward entry: "+k); }
            // Mission99: mission80-batch also rewrites totals/lastRun/source/crossWardDuplicateIds. Allowed only if each is validated.
            const DERIVED=["totals","lastRun","source","crossWardDuplicateIds"];
            const extra=Object.keys(b).filter(k=>!["mission","vintage","wards","updatedAt"].includes(k)&&!DERIVED.includes(k)&&!same(a[k],b[k]));
            if(extra.length) throw new Error("unexpected top-level keys changed: "+extra);
            const ok=Object.values(b.wards).filter(x=>x&&x.status==="ok"), fl=Object.values(b.wards).filter(x=>x&&x.status==="failed");
            if(b.totals!==undefined){ const t=b.totals, e={wardsOk:ok.length,wardsFailed:fl.length,buildings:ok.reduce((n,x)=>n+x.buildings,0),outBytes:ok.reduce((n,x)=>n+x.outBytes,0)};
              if(!same(t,e)) throw new Error("totals inconsistent with wards: "+JSON.stringify(t)+" vs "+JSON.stringify(e)); }
            if(b.lastRun!==undefined){ const r=b.lastRun;
              if(!r||typeof r!=="object"||!Number.isInteger(r.processed)||r.processed>1||r.failedNow!==0||typeof r.at!=="string"||Object.keys(r).some(k=>!["processed","failedNow","stoppedBy","at"].includes(k))) throw new Error("lastRun invalid: "+JSON.stringify(r)); }
            if(b.source!==undefined){ const L=JSON.parse(fs.readFileSync("data/reports/mission79/source-lock.json","utf8")), s=b.source;
              if(s.url!==(L.resource&&L.resource.url)||s.etag!==(L.http&&L.http.etag)||s.bytes!==(L.http&&L.http.contentLength)||s.lastModified!==(L.http&&L.http.lastModified)) throw new Error("manifest source differs from hash-verified source-lock"); }
            if(b.crossWardDuplicateIds!==undefined){ const d=b.crossWardDuplicateIds;
              if(!d||typeof d!=="object"||Array.isArray(d)||Object.values(d).some(v=>!Number.isInteger(v))) throw new Error("crossWardDuplicateIds invalid"); }
            if(!b.wards[w]) throw new Error("target ward entry missing");
            console.log("manifest diff ok: only wards."+w+" and updatedAt may differ");
          '
      - name: Persist to private repo (token only here) and verify sha256
        env:
          LIVECITY_3D_DATA_TOKEN: ${{ secrets.LIVECITY_3D_DATA_TOKEN }}
        run: |
          echo "::add-mask::$LIVECITY_3D_DATA_TOKEN"
          node tools/mission95-persist-ward.mjs --ward "$WARD" --repo "$DATA_REPO" --execute
          node tools/mission87-persist.mjs status
