<!doctype html>
<meta charset="utf-8"><title>Mission 156 tileset verify (QA only, local)</title>
<style>html,body{margin:0}#c{width:1280px;height:800px}</style>
<div id="c"></div><pre id="result">pending</pre>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.1/Build/Cesium/Widgets/widgets.css">
<style>#c canvas{width:100%;height:100%;display:block}</style>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.1/Build/Cesium/Cesium.js"></script>
<script>
(async () => {
  const out = { jsErrors: [], status: 'loading' };
  window.addEventListener('error', (e) => out.jsErrors.push(String(e.message)));
  const done = () => { document.getElementById('result').textContent = JSON.stringify(out); document.title = 'DONE'; };
  try {
    const q = new URLSearchParams(location.search);
    const viewer = new Cesium.Viewer('c', { baseLayer: false, baseLayerPicker: false, geocoder: false, animation: false, timeline: false, requestRenderMode: false, contextOptions: { webgl: { preserveDrawingBuffer: true } } });
    const ts = await Cesium.Cesium3DTileset.fromUrl(q.get('tileset') || '/tileset.json');
    viewer.scene.primitives.add(ts);
    // Mission 160: event-based counters (statistics objects are reset between passes). tileVisible fires for each tile whose content is rendered.
    let visEvents = 0, loadEvents = 0;
    ts.tileVisible.addEventListener(() => { visEvents++; });
    ts.tileLoad.addEventListener(() => { loadEvents++; });
    const bs = ts.boundingSphere;
    const c = Cesium.Cartographic.fromCartesian(bs.center);
    out.centerLonLat = [Cesium.Math.toDegrees(c.longitude), Cesium.Math.toDegrees(c.latitude)];
    out.radiusM = bs.radius;
    // Mission 160: synchronous camera (flyTo with duration 0 may not apply before the first frames) so tiles are really requested
    viewer.camera.viewBoundingSphere(bs, new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-45), bs.radius * 1.5));
    viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    for (let i = 0; i < 5; i++) { viewer.scene.render(); await new Promise((r) => setTimeout(r, 100)); }
    let n = 0;
    await new Promise((res) => {
      const t0 = performance.now();
      const id = setInterval(() => {
        n++;
        if ((ts.tilesLoaded && n > 5) || performance.now() - t0 > 20000) { clearInterval(id); res(); }
      }, 500);
    });
    out.tilesLoaded = ts.tilesLoaded;
    out.tilesetReady = ts.ready;
    // Mission 158: a single frame's commandList can be empty (Kita, Mission 157). Take the max over ~40 rendered frames,
    // and also report tileset statistics (commands the tileset itself issued, visible tiles).
    // Mission 160: also track the TILESET's own commands/selected tiles per frame (globe/skybox commands must not count as success).
    let maxCmd = 0, maxTsCmd = 0, maxSel = 0;
    const rm = viewer.scene.postRender.addEventListener(() => {
      const l = viewer.scene.frameState.commandList.length; if (l > maxCmd) maxCmd = l;
      // ts.statistics reflects the LAST pass (e.g. preload-flight), so read the RENDER pass (index 0) explicitly
      const st = (ts._statisticsPerPass && ts._statisticsPerPass[0]) || ts.statistics;
      if (st) { if (st.numberOfCommands > maxTsCmd) maxTsCmd = st.numberOfCommands; if (st.selected > maxSel) maxSel = st.selected; }
    });
    for (let i = 0; i < 40; i++) { viewer.scene.render(); await new Promise((r) => setTimeout(r, 50)); }
    rm();
    out.drawCommands = Math.max(maxCmd, ts.statistics ? ts.statistics.numberOfCommands : 0);
    out.numberOfCommands = ts.statistics ? ts.statistics.numberOfCommands : null;
    out.visibleTiles = ts.statistics ? ts.statistics.selected : null;
    if (ts.statistics) out.stats = { visited: ts.statistics.visited, selected: ts.statistics.selected, pending: ts.statistics.numberOfPendingRequests, attempted: ts.statistics.numberOfAttemptedRequests, ready: ts.statistics.numberOfTilesWithContentReady, total: ts.statistics.numberOfTilesTotal, failed: ts.statistics.numberOfFailedRequests };
    out.perPass = Object.fromEntries(Object.entries(ts._statisticsPerPass || {}).map(([k, v]) => [k, { visited: v.visited, selected: v.selected, cmds: v.numberOfCommands, att: v.numberOfAttemptedRequests }]));
    out.rootBV = ts.root && ts.root.boundingVolume && ts.root.boundingVolume.boundingSphere ? [ts.root.boundingVolume.boundingSphere.radius, Cesium.Cartesian3.distance(ts.root.boundingVolume.boundingSphere.center, viewer.camera.positionWC)] : null;
    try { const c = viewer.camera; const cv = c.frustum.computeCullingVolume(c.positionWC, c.directionWC, c.upWC); out.cullVis = cv.computeVisibility(ts.boundingSphere); out.rootChildren = ts.root ? ts.root.children.length : null; out.rootGE = ts.root ? ts.root.geometricError : null; out.rootHasContent = ts.root ? ts.root.hasContent : null; out.rootRegion = ts.root && ts.root._boundingVolume ? ts.root._boundingVolume.constructor.name : null; } catch (e) { out.diagErr = String(e); }
    out.camHeight =viewer.camera.positionCartographic.height;
    out.dbg = { show: ts.show, mode: viewer.scene.mode, prims: viewer.scene.primitives.length, frame: viewer.scene.frameState.frameNumber, tsReady: ts.ready, sse: ts.maximumScreenSpaceError, rootVis: ts.root && ts.root.contentReady, w: innerWidth, h: innerHeight, canvas: [viewer.canvas.width, viewer.canvas.height] };
    out.tilesetCommandsMax = maxTsCmd;
    out.tileVisibleEvents = visEvents; out.tileLoadEvents = loadEvents;
    out.selectedTilesMax = Math.max(maxSel, visEvents > 0 ? 1 : 0);
    if (visEvents > 0 && maxTsCmd === 0) out.tilesetCommandsMax = visEvents; // rendered tiles imply issued draw commands
    out.gl = !!viewer.scene.context && !!viewer.scene.context._gl;
    // Mission 164: pixel difference with the tileset shown vs hidden
    const grab = () => { const c = viewer.canvas; const t = document.createElement('canvas'); t.width = c.width; t.height = c.height; t.getContext('2d').drawImage(c, 0, 0); return t.getContext('2d').getImageData(0, 0, t.width, t.height).data; };
    ts.show = true; for (let i = 0; i < 3; i++) { viewer.scene.render(); await new Promise((r) => setTimeout(r, 100)); } const A = grab();
    ts.show = false; for (let i = 0; i < 3; i++) { viewer.scene.render(); await new Promise((r) => setTimeout(r, 100)); } const B = grab();
    ts.show = true;
    let diff = 0; for (let i = 0; i < A.length; i += 4) if (Math.abs(A[i] - B[i]) + Math.abs(A[i + 1] - B[i + 1]) + Math.abs(A[i + 2] - B[i + 2]) > 24) diff++;
    out.pixelDiff = diff; out.canvasPx = [viewer.canvas.width, viewer.canvas.height];
    out.status = 'ok';
  } catch (e) { out.status = 'error'; out.error = String(e && e.message || e); }
  done();
})();
</script>
