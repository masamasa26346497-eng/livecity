<!doctype html>
<meta charset="utf-8"><title>Mission 156 tileset verify (QA only, local)</title>
<style>html,body,#c{margin:0;width:100%;height:100%}</style>
<div id="c"></div><pre id="result">pending</pre>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.1/Build/Cesium/Cesium.js"></script>
<script>
(async () => {
  const out = { jsErrors: [], status: 'loading' };
  window.addEventListener('error', (e) => out.jsErrors.push(String(e.message)));
  const done = () => { document.getElementById('result').textContent = JSON.stringify(out); document.title = 'DONE'; };
  try {
    const q = new URLSearchParams(location.search);
    const viewer = new Cesium.Viewer('c', { baseLayer: false, baseLayerPicker: false, geocoder: false, animation: false, timeline: false, requestRenderMode: false });
    const ts = await Cesium.Cesium3DTileset.fromUrl(q.get('tileset') || '/tileset.json');
    viewer.scene.primitives.add(ts);
    const bs = ts.boundingSphere;
    const c = Cesium.Cartographic.fromCartesian(bs.center);
    out.centerLonLat = [Cesium.Math.toDegrees(c.longitude), Cesium.Math.toDegrees(c.latitude)];
    out.radiusM = bs.radius;
    viewer.camera.flyToBoundingSphere(bs, { duration: 0 });
    let n = 0;
    await new Promise((res) => {
      const t0 = performance.now();
      const id = setInterval(() => {
        n++;
        if ((ts.tilesLoaded && n > 5) || performance.now() - t0 > 20000) { clearInterval(id); res(); }
      }, 500);
    });
    out.tilesLoaded = ts.tilesLoaded;
    out.tilesetReady = ts.ready;
    out.drawCommands = viewer.scene.frameState ? viewer.scene.frameState.commandList.length : null;
    out.gl = !!viewer.scene.context && !!viewer.scene.context._gl;
    out.status = 'ok';
  } catch (e) { out.status = 'error'; out.error = String(e && e.message || e); }
  done();
})();
</script>
