# Mission 209: TEMPLATE (the GitHub App cannot write .github/workflows). Owner copies it ONCE via the Web UI:
#   cp tools/lod2/cloud-workflow/lod2-release-merge.yml .github/workflows/lod2-release-merge.yml   (on the default branch)
# Reuses the EXISTING secret LIVECITY_3D_DATA_READ_TOKEN and the exact fixed-curl pattern of mission129-fetch-21.yml. No new secret / PAT.
# The token is visible ONLY to the fetch step (fixed curl GETs). Node/Claude/gh never see it. Nothing is uploaded: no artifact, no cache, no release write.
# Mission 210: pipefail shell, pre-extraction tar audit (types/sizes/counts), fail-closed fetch, assembler --allow-missing kita,chuo (they come from the overlay), Chrome verifies the MERGED tree.
# Data lives in RUNNER_TEMP and vanishes with the job. workflow_dispatch only; owner only; runs the PR-branch tools.
name: lod2-release-merge
on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'also run static-HTTP Chrome verification of the merged tree'
        type: boolean
        default: false
      tools_ref:
        description: 'ref of the tools to run (branch or full commit SHA; prefer a SHA for real-data runs)'
        type: string
        default: 'mission152-lod2-parallel'
permissions:
  contents: read
defaults:
  run:
    shell: bash   # = bash -eo pipefail. The implicit default shell has NO pipefail, so `node ... | tee` used to mask exit 3 (Mission 210).
concurrency:
  group: lod2-release-merge
  cancel-in-progress: false
env:
  DATA_REPO: masamasa26346497-eng/livecity-3d-data
  TAG: plateau2025-converted
  MAX_ARCHIVE_BYTES: '1073741824'     # compressed asset cap (1 GiB)
  MAX_MEMBER_BYTES: '1073741824'      # single uncompressed member cap
  MAX_UNPACKED_ARCHIVE: '2147483648'  # uncompressed cap per archive (decided BEFORE extraction from the verbose listing)
  MAX_UNPACKED_TOTAL: '4294967296'    # uncompressed cap over all archives (same as the assembler's --max-bytes)
  MAX_MEMBERS: '200000'
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.actor == github.repository_owner && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tools_ref }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch ward archives (READ token only here; GET only; size-capped; unsafe members refused BEFORE extraction)
        env:
          READ_TOKEN: ${{ secrets.LIVECITY_3D_DATA_READ_TOKEN }}
        run: |
          set -eu
          [ -n "$READ_TOKEN" ] || { echo "FAIL: LIVECITY_3D_DATA_READ_TOKEN empty"; exit 1; }
          echo "::add-mask::$READ_TOKEN"
          T="${RUNNER_TEMP:?}"; mkdir -p "$T/rel"; umask 077
          CURL="curl -sS --proto =https --proto-redir =https --max-time 900"
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$READ_TOKEN" | $CURL -K - -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -o "$T/rel.json" -w '%{http_code}' "https://api.github.com/repos/$DATA_REPO/releases/tags/$TAG" || true)
          echo "release GET -> HTTP $code"; [ "$code" = "200" ] || exit 1
          wards=$(jq -r '.wards[].id' config/wards/registry.json)
          total=0; bytes_total=0; missing=""
          for w in $wards; do
            case "$w" in ''|*[!a-z0-9-]*) echo "FAIL: unsafe ward id in registry: $w"; exit 1;; esac
            id=$(jq -r --arg a "plateau2025-$w.tar.gz" '.assets[]|select(.name==$a)|.id' "$T/rel.json" | head -n1)
            [ -n "$id" ] || { echo "[$w] asset missing"; missing="$missing $w"; continue; }
            size=$(jq -r --arg a "plateau2025-$w.tar.gz" '.assets[]|select(.name==$a)|.size' "$T/rel.json" | head -n1)
            [ "${size:-0}" -le "$MAX_ARCHIVE_BYTES" ] || { echo "FAIL [$w]: archive > cap"; exit 1; }
            printf 'header = "Authorization: Bearer %s"\n' "$READ_TOKEN" | $CURL -L --fail --max-filesize "$MAX_ARCHIVE_BYTES" -K - -H 'Accept: application/octet-stream' -o "$T/$w.tgz" "https://api.github.com/repos/$DATA_REPO/releases/assets/$id" || { echo "FAIL [$w]: download failed"; rm -f "$T/${w:?}.tgz"; exit 1; }
            # --- pre-extraction audit: verbose listing = type char + size per member. Only regular files and directories are allowed. ---
            tar -tvzf "$T/$w.tgz" > "$T/$w.vlist" || { echo "FAIL [$w]: unreadable archive"; rm -f "$T/${w:?}.tgz"; exit 1; }
            tar -tzf "$T/$w.tgz" > "$T/$w.list"   || { echo "FAIL [$w]: unreadable archive"; rm -f "$T/${w:?}.tgz"; exit 1; }
            if grep -qvE '^[-d]' "$T/$w.vlist"; then echo "FAIL [$w]: symlink/hardlink/special member refused"; grep -vE '^[-d]' "$T/$w.vlist" | head -n 5; exit 1; fi
            if grep -qE '(^/|(^|/)\.\.(/|$)|\\)' "$T/$w.list"; then echo "FAIL [$w]: unsafe member names"; exit 1; fi
            if grep -q '[[:cntrl:]]' "$T/$w.list"; then echo "FAIL [$w]: control characters in member names"; exit 1; fi
            members=$(wc -l < "$T/$w.vlist")
            [ "$members" -le "$MAX_MEMBERS" ] || { echo "FAIL [$w]: $members members > cap"; exit 1; }
            unpacked=$(awk '$1 ~ /^-/ {s+=$3; if ($3>m) m=$3} END {printf "%d %d", s, m}' "$T/$w.vlist")
            sum=${unpacked% *}; big=${unpacked#* }
            [ "$big" -le "$MAX_MEMBER_BYTES" ] || { echo "FAIL [$w]: single member $big bytes > cap"; exit 1; }
            [ "$sum" -le "$MAX_UNPACKED_ARCHIVE" ] || { echo "FAIL [$w]: unpacked $sum bytes > cap (tar bomb?)"; exit 1; }
            bytes_total=$((bytes_total+sum))
            [ "$bytes_total" -le "$MAX_UNPACKED_TOTAL" ] || { echo "FAIL: cumulative unpacked $bytes_total bytes > cap"; exit 1; }
            mkdir -p "$T/b24/_x_$w"
            tar -xzf "$T/$w.tgz" --no-same-owner --no-same-permissions --no-overwrite-dir -C "$T/b24/_x_$w"
            rm -f "$T/${w:?}.tgz" "$T/${w:?}.list" "$T/${w:?}.vlist"
            total=$((total+1))
          done
          echo "extracted: $total archives; unpacked bytes: $bytes_total; missing assets:${missing:- none}"
          echo "MISSING_WARDS=${missing# }" >> "$GITHUB_ENV"
      - name: Assemble 24-ward base (no token; validates tree, ids, GLB, wardCode)
        run: node tools/lod2/lod2-release-assemble.mjs --root "${RUNNER_TEMP:?}/b24" --out "${RUNNER_TEMP:?}/base24" --report "${RUNNER_TEMP:?}/assemble.json" --max-bytes "$MAX_UNPACKED_TOTAL" --allow-missing kita,chuo | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Official PLATEAU 2025 Kita/Chuo LOD2 + complement LOD1 (public Range fetch, no token)
        run: |
          set -eu
          for w in kita chuo; do node tools/mission79-run.mjs --ward $w --max-mb 1500; done
          node tools/lod2/lod2-build-all.mjs
          for w in kita chuo; do node tools/mission79-build-ward-2025.cjs --ward $w --jsonl temp/mission79/$w-work/$w.jsonl --out temp/mission79/$w-2025-ex --exclude-ids temp/lod2-all/manifest.json; done
          node tools/lod2/lod2-cloud-bundle.mjs --wards kita,chuo
      - name: Merge (base 24 wards kept; Kita/Chuo swapped to 2025 complement + LOD2)
        run: |
          mkdir -p temp
          node tools/lod2/lod2-cloud-merge.mjs --base "${RUNNER_TEMP:?}/base24" --overlay temp/cloud-bundle --out temp/cloud-merged --symlink --report temp/merge-report.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Static Chrome verification (optional)
        if: inputs.browser
        run: node tools/lod2/lod2-cloud-verify.cjs --bundle temp/cloud-merged
