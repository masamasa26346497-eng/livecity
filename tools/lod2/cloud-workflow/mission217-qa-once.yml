# Mission 217: QA-once template. Same safety model as Mission 211 (one ci branch, SHA-pinned tools, read token only in fetch step, no artifact/cache/deploy), plus survey + real-click QA.
# Copy VERBATIM to .github/workflows/mission217-qa-once.yml on a temp branch  ci/mission217-qa-once  (from main). NEVER merge it.
# Mission 217: ONE-SHOT push-trigger TEMPLATE (the GitHub App cannot write .github/workflows).
# Copy this file VERBATIM to  .github/workflows/mission217-qa-once.yml  on a temporary branch  ci/mission217-qa-once
# (created from main). NEVER merge that branch into main. The commit that adds the file is itself the push that triggers the run.
# Safety model:
#  - on: push, ONE branch only; the job re-checks github.ref. No pull_request / pull_request_target / workflow_run / schedule / dispatch.
#  - The code that runs is NOT the branch's code: actions/checkout pins TOOLS_SHA (full 40-hex, reviewed). A step re-verifies HEAD == TOOLS_SHA.
#  - LIVECITY_3D_DATA_READ_TOKEN (existing secret, no new PAT) is passed ONLY to the fixed-curl fetch step. node / gh / Chrome never see it.
#    GITHUB_TOKEN is read-only (contents: read) and is NOT used for the private repo. Checkout uses persist-credentials: false.
#  - Nothing leaves the runner: no upload-artifact, no cache, no release write, no Vercel. Data lives in RUNNER_TEMP. Output = job summary only.
#  - Guards carried over from Mission 210: pipefail shell, pre-extraction tar audit (types/names/sizes/counts), fail-closed fetch,
#    24-ward completeness (kita/chuo may come from the 2025 overlay only; ANY other missing ward FAILS), Chrome checks the MERGED tree.
# Re-trigger: push another commit to the same branch (limitation: a push made with the default GITHUB_TOKEN does not start workflows;
#   pushes by a GitHub App installation/OAuth/PAT as a user normally do. Not verified from here. Fallback = main's mission129 owner dispatcher.)
# Cost: public-repo runners are free; on a private repo this uses included minutes. timeout-minutes is capped at 90.
name: mission217-qa-once
on:
  push:
    branches: [ci/mission217-qa-once]
permissions:
  contents: read
defaults:
  run:
    shell: bash   # = bash -eo pipefail
concurrency:
  group: mission217-qa-once
  cancel-in-progress: false
env:
  TOOLS_SHA: cbd53531ac9f200a5f5fedfead41987b5e6710b6   # reviewed Mission 217 tree (real-click QA + survey; keeps Mission 210 pipefail + tar audit). Change only after review.
  DATA_REPO: masamasa26346497-eng/livecity-3d-data
  TAG: plateau2025-converted
  MAX_ARCHIVE_BYTES: '1073741824'
  MAX_MEMBER_BYTES: '1073741824'
  MAX_UNPACKED_ARCHIVE: '2147483648'
  MAX_UNPACKED_TOTAL: '4294967296'
  MAX_MEMBERS: '200000'
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.ref == 'refs/heads/ci/mission217-qa-once' && github.event_name == 'push' && github.repository == 'masamasa26346497-eng/livecity'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbd53531ac9f200a5f5fedfead41987b5e6710b6   # must equal env.TOOLS_SHA (checked next step); literal because env is not allowed in `with` here
          persist-credentials: false
          fetch-depth: 1
      - name: Verify pinned tools commit (refuse to run any other code)
        run: |
          [ "$(git rev-parse HEAD)" = "$TOOLS_SHA" ] || { echo "FAIL: checked-out $(git rev-parse HEAD) != TOOLS_SHA"; exit 1; }
          printf '%s' "$TOOLS_SHA" | grep -qE '^[0-9a-f]{40}$'
          echo "tools pinned at $TOOLS_SHA (workflow file from ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch ward archives (READ token only here; GET only; size-capped; unsafe members refused BEFORE extraction)
        env:
          READ_TOKEN: ${{ secrets.LIVECITY_3D_DATA_READ_TOKEN }}
        run: |
          set -eu
          [ -n "$READ_TOKEN" ] || { echo "FAIL: LIVECITY_3D_DATA_READ_TOKEN empty"; exit 1; }
          echo "::add-mask::$READ_TOKEN"
          T="${RUNNER_TEMP:?}"; mkdir -p "$T/rel"; umask 077
          CURL="curl -sS --proto =https --proto-redir =https --max-time 900"
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$READ_TOKEN" | $CURL -K - -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -o "$T/rel.json" -w '%{http_code}' "https://api.github.com/repos/$DATA_REPO/releases/tags/$TAG" || true)
          echo "release GET -> HTTP $code"; [ "$code" = "200" ] || exit 1
          wards=$(jq -r '.wards[].id' config/wards/registry.json)
          total=0; bytes_total=0; missing=""
          for w in $wards; do
            case "$w" in ''|*[!a-z0-9-]*) echo "FAIL: unsafe ward id in registry: $w"; exit 1;; esac
            id=$(jq -r --arg a "plateau2025-$w.tar.gz" '.assets[]|select(.name==$a)|.id' "$T/rel.json" | head -n1)
            [ -n "$id" ] || { echo "[$w] asset missing"; missing="$missing $w"; continue; }
            size=$(jq -r --arg a "plateau2025-$w.tar.gz" '.assets[]|select(.name==$a)|.size' "$T/rel.json" | head -n1)
            [ "${size:-0}" -le "$MAX_ARCHIVE_BYTES" ] || { echo "FAIL [$w]: archive > cap"; exit 1; }
            printf 'header = "Authorization: Bearer %s"\n' "$READ_TOKEN" | $CURL -L --fail --max-filesize "$MAX_ARCHIVE_BYTES" -K - -H 'Accept: application/octet-stream' -o "$T/$w.tgz" "https://api.github.com/repos/$DATA_REPO/releases/assets/$id" || { echo "FAIL [$w]: download failed"; rm -f "$T/${w:?}.tgz"; exit 1; }
            # --- pre-extraction audit: verbose listing = type char + size per member. Only regular files and directories are allowed. ---
            tar -tvzf "$T/$w.tgz" > "$T/$w.vlist" || { echo "FAIL [$w]: unreadable archive"; rm -f "$T/${w:?}.tgz"; exit 1; }
            tar -tzf "$T/$w.tgz" > "$T/$w.list"   || { echo "FAIL [$w]: unreadable archive"; rm -f "$T/${w:?}.tgz"; exit 1; }
            if grep -qvE '^[-d]' "$T/$w.vlist"; then echo "FAIL [$w]: symlink/hardlink/special member refused"; grep -vE '^[-d]' "$T/$w.vlist" | head -n 5; exit 1; fi
            if grep -qE '(^/|(^|/)\.\.(/|$)|\\)' "$T/$w.list"; then echo "FAIL [$w]: unsafe member names"; exit 1; fi
            if grep -q '[[:cntrl:]]' "$T/$w.list"; then echo "FAIL [$w]: control characters in member names"; exit 1; fi
            members=$(wc -l < "$T/$w.vlist")
            [ "$members" -le "$MAX_MEMBERS" ] || { echo "FAIL [$w]: $members members > cap"; exit 1; }
            unpacked=$(awk '$1 ~ /^-/ {s+=$3; if ($3>m) m=$3} END {printf "%d %d", s, m}' "$T/$w.vlist")
            sum=${unpacked% *}; big=${unpacked#* }
            [ "$big" -le "$MAX_MEMBER_BYTES" ] || { echo "FAIL [$w]: single member $big bytes > cap"; exit 1; }
            [ "$sum" -le "$MAX_UNPACKED_ARCHIVE" ] || { echo "FAIL [$w]: unpacked $sum bytes > cap (tar bomb?)"; exit 1; }
            bytes_total=$((bytes_total+sum))
            [ "$bytes_total" -le "$MAX_UNPACKED_TOTAL" ] || { echo "FAIL: cumulative unpacked $bytes_total bytes > cap"; exit 1; }
            mkdir -p "$T/b24/_x_$w"
            tar -xzf "$T/$w.tgz" --no-same-owner --no-same-permissions --no-overwrite-dir -C "$T/b24/_x_$w"
            rm -f "$T/${w:?}.tgz" "$T/${w:?}.list" "$T/${w:?}.vlist"
            total=$((total+1))
          done
          echo "extracted: $total archives; unpacked bytes: $bytes_total; missing assets:${missing:- none}"
          echo "MISSING_WARDS=${missing# }" >> "$GITHUB_ENV"

      - name: Assemble 24-ward base (no token; validates tree, ids, GLB, wardCode)
        run: node tools/lod2/lod2-release-assemble.mjs --root "${RUNNER_TEMP:?}/b24" --out "${RUNNER_TEMP:?}/base24" --report "${RUNNER_TEMP:?}/assemble.json" --max-bytes "$MAX_UNPACKED_TOTAL" --allow-missing kita,chuo | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Official PLATEAU 2025 Kita/Chuo LOD2 + complement LOD1 (public Range fetch, no token)
        run: |
          set -eu
          for w in kita chuo; do node tools/mission79-run.mjs --ward $w --max-mb 1500; done
          node tools/lod2/lod2-build-all.mjs
          for w in kita chuo; do node tools/mission79-build-ward-2025.cjs --ward $w --jsonl temp/mission79/$w-work/$w.jsonl --out temp/mission79/$w-2025-ex --exclude-ids temp/lod2-all/manifest.json; done
          node tools/lod2/lod2-cloud-bundle.mjs --wards kita,chuo
      - name: Merge (24 wards kept; Kita/Chuo swapped to 2025 complement + LOD2). Exit 3 = a ward is missing -> job FAILS
        run: |
          mkdir -p temp
          node tools/lod2/lod2-cloud-merge.mjs --base "${RUNNER_TEMP:?}/base24" --overlay temp/cloud-bundle --out temp/cloud-merged --symlink --report temp/merge-report.json | tee -a "$GITHUB_STEP_SUMMARY"
          node -e "const r=require('./temp/merge-report.json'); if(r.full24!==true){console.error('FAIL: full24 is not true');process.exit(3)}"
      - name: LOD2 GLB structure check (unlit blue-grey material, per-building canonicalId for click picking)
        run: |
          node --input-type=module -e "
          import fs from 'fs'; import path from 'path';
          const root='temp/cloud-merged'; const out=[]; const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name); e.isDirectory()?walk(p):(p.endsWith('.glb')&&p.includes('lod2')&&out.push(p))}};
          walk(root); if(!out.length){console.error('FAIL: no LOD2 GLB in merged tree');process.exit(4)}
          let bad=0; for(const f of out.slice(0,50)){const b=fs.readFileSync(f); const j=JSON.parse(b.slice(20,20+b.readUInt32LE(12)).toString());
            const ext=JSON.stringify(j.extensionsUsed||[]); const ok=ext.includes('KHR_materials_unlit')&&ext.includes('EXT_mesh_features')&&ext.includes('EXT_structural_metadata'); if(!ok){bad++;console.error('BAD',f,ext)}}
          console.log('LOD2 GLBs found: '+out.length+', checked '+Math.min(50,out.length)+', bad '+bad); process.exit(bad?5:0)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Static Chrome verification of the MERGED tree (HTTP200 / LOD2 tiles / pixel diff)
        run: node tools/lod2/lod2-cloud-verify.cjs --bundle temp/cloud-merged | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Size / file-count / 404-category survey of the MERGED tree (sizes and categories only; no ids, no attributes)
        run: node tools/lod2/lod2-merged-survey.mjs --root temp/cloud-merged --not-found temp/cloud-verify/result.json --out temp/survey.json --limit-mb 100 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: REAL mouse-click QA (CDP Input events -> Cesium pick -> canonicalId -> building panel; LOD2 Kita/Chuo + LOD1 examples)
        run: node tools/lod2/lod2-click-qa.cjs --bundle temp/cloud-merged --out temp/click-qa | tee -a "$GITHUB_STEP_SUMMARY"
