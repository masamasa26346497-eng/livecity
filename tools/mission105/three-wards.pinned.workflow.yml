# Mission 105: OWNER-INSTALLED, OWNER-DISPATCHED ONLY. NOT installed by this commit (a GitHub App cannot write .github/workflows).
# GENERATED by `node tools/mission105/render.mjs --pin <sha>` from the audited Mission103 template/steps. Do not hand-edit hashes.
# Scope: ONLY ikuno, abeno, yodogawa (the 3 wards whose inflated GML exceeded the 1200MB gate). Conversion uses the Mission104 bounded chunked path.
# The 21 already-stored wards are never listed, never converted, never uploaded here. Stored target wards are re-downloaded, sha256 recomputed and skipped.
# No overwrite input exists. No automatic retry (re-dispatch resumes). Result is STORAGE ONLY (browser acceptance stays 0).
name: Mission105 persist 3 oversized wards (chunked)
on:
  workflow_dispatch:
    inputs:
      wards:
        description: "ALL (default) = ikuno,abeno,yodogawa, or a comma-separated subset of those three. Any other ward is rejected"
        required: true
        type: string
        default: "ALL"
permissions:
  contents: read
concurrency:
  group: mission105-persist-3-wards
  cancel-in-progress: false
env:
  PIN_SHA: "86264e6c539bd9fbe6abcea7c4e03b760d61e1e3"
  DATA_REPO: masamasa26346497-eng/livecity-3d-data
  TAG: plateau2025-converted
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      rest_matrix: ${{ steps.plan.outputs.rest_matrix }}
      rest_count: ${{ steps.plan.outputs.rest_count }}
      stored: ${{ steps.plan.outputs.stored }}
    steps:
      - name: Plan (validate input, re-verify stored wards; curl only, no repo code)
        id: plan
        env:
          DATA_TOKEN: ${{ secrets.LIVECITY_3D_DATA_TOKEN }}
          IN_WARDS: ${{ inputs.wards }}
        run: |
          set -eu
          [ -n "$DATA_TOKEN" ] || { echo "FAIL: secret empty or missing"; exit 1; }
          echo "::add-mask::$DATA_TOKEN"
          ALL="ikuno abeno yodogawa"
          [ "$(printf '%s\n' $ALL | wc -l)" = "3" ] && [ "$(printf '%s\n' $ALL | sort -u | wc -l)" = "3" ] || { echo "FAIL: ward list is not 3 unique"; exit 1; }
          raw=$(printf '%s' "$IN_WARDS" | tr -d ' \n\r')
          if [ "$raw" = "ALL" ]; then want="$ALL"; else
            want=$(printf '%s' "$raw" | tr ',' ' ')
            [ -n "$want" ] || { echo "FAIL: no wards"; exit 1; }
            seen=" "
            for w in $want; do
              printf '%s' "$w" | grep -Eq '^[a-z]+$' || { echo "FAIL: invalid ward token"; exit 1; }
              case " $ALL " in *" $w "*) ;; *) echo "FAIL: not one of the 3 Mission105 wards (ikuno abeno yodogawa): $w"; exit 1;; esac
              case "$seen" in *" $w "*) echo "FAIL: duplicate ward: $w"; exit 1;; esac
              seen="$seen$w "
            done
          fi
          code=$(curl -sS -o repo.json -w '%{http_code}' -H "Authorization: Bearer $DATA_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$DATA_REPO")
          [ "$code" = "200" ] || { echo "FAIL: repo GET HTTP $code"; exit 1; }
          [ "$(jq -r .visibility repo.json)" = "private" ] && [ "$(jq -r '.permissions.push // false' repo.json)" = "true" ] || { echo "FAIL: need private + push"; exit 1; }
          code=$(curl -sS -o rel.json -w '%{http_code}' -H "Authorization: Bearer $DATA_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$DATA_REPO/releases/tags/$TAG")
          if [ "$code" = "404" ]; then echo '{"assets":[]}' > rel.json; elif [ "$code" != "200" ]; then echo "FAIL: release GET HTTP $code"; exit 1; fi
          todo=""; stored=""; : > summary.md
          echo "### Plan (stored = permanent private storage, NOT browser accepted)" >> summary.md
          for w in $want; do
            id=$(jq -r --arg a "plateau2025-$w.tar.gz" '.assets[]|select(.name==$a)|.id' rel.json | head -n1)
            if [ -n "$id" ]; then
              curl -sSL --fail -H "Authorization: Bearer $DATA_TOKEN" -H 'Accept: application/octet-stream' -o "chk-$w.tgz" "https://api.github.com/repos/$DATA_REPO/releases/assets/$id"
              tar -tzf "chk-$w.tgz" | grep -q 'tileset.json' || { echo "FAIL: stored $w archive has no tileset.json"; exit 1; }
              sha=$(sha256sum "chk-$w.tgz" | cut -d' ' -f1); rm -f "chk-$w.tgz"
              echo "stored-skip $w sha256=$sha"; echo "- $w: already stored, re-downloaded sha256 \`$sha\` (skipped, not reconverted)" >> summary.md
              stored="$stored $w"
            else
              todo="$todo $w"; echo "- $w: will convert + persist" >> summary.md
            fi
          done
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          rest="$todo"
          mk() { l=$(for w in $1; do printf '"%s",' "$w"; done); echo "[${l%,}]"; }
          rl=$(mk "$rest")
          echo "rest_matrix={\"ward\":$rl}" >> "$GITHUB_OUTPUT"; echo "rest_count=$(echo "$rl" | jq length)" >> "$GITHUB_OUTPUT"
          echo "stored=$(echo $stored)" >> "$GITHUB_OUTPUT"
          echo "rest: $rl"
  rest:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.rest_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.rest_matrix) }}
    env:
      WARD: ${{ matrix.ward }}
      PIN_SHA: "86264e6c539bd9fbe6abcea7c4e03b760d61e1e3"
      DATA_REPO: masamasa26346497-eng/livecity-3d-data
    steps:
      - name: Checkout pinned audited commit
        uses: actions/checkout@v4
        with:
          ref: "86264e6c539bd9fbe6abcea7c4e03b760d61e1e3"
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write trusted hash list (from this workflow file)
        run: |
          cat > "$RUNNER_TEMP/pin.sha256" <<'HASHES'
          2cecaf79b421cd05eaaa601491987bfcf8246716415d5adf1f0845513e3bc8df  config/areas/osaka-city.json
          ba3d6d64f23a8084808d67aacc331d3dd540e8d46d226e21c1c35371e7944d58  data/processed/osaka-city/boundaries/ward-classification-polygons.json
          e0b85f229994f39e2cf331e87dccf63db81752ba68a903982afce4b2816f3fbf  data/reports/mission79/source-lock.json
          33bab001893e53ec64109325a160df76a9ad94ac2ad51c27b2ff688390e03ca7  tools/mission104/chunked-run.mjs
          61e6a6fe445b289456e79d4af191ba375bbe3c5b987b3d3336a12337732bbde0  tools/mission105/chunked-batch.mjs
          b5dd30c9d186e105a9e9b17a8950f7042f4bb6d61d42f40b4a5473c8d4721d23  tools/mission36k-convert-citygml-runtime.mjs
          bb2ea0322837f635fa7fa0787954520a6506b135d5fb2bd86e3774be6bcbfacc  tools/mission37b-build-3dtiles.cjs
          a2e0e5923250d603ed4bfcc6acf144e85c98bc6f41e40a4f7a45108305dd5aed  tools/mission79-build-ward-2025.cjs
          c40a418700c5c73afc834e30f51741003f9f679fa8f53eb77d94e27f095eb602  tools/mission79-plateau2025-fetch.mjs
          48e1af17784a1a0b749a121fcf8e01da9cfeb6f5469b5be858bf57f0183c330d  tools/mission79-plateau2025-source.mjs
          c95c1be46c49514e9c67a0845e52b65e221f0522fa6c62325a0bc04a5eff5657  tools/mission79-run.mjs
          fe1e4a1ee5e6aa64ed67826c9a5a69de41cd1ee988e4aea675850ec34cf04ae2  tools/mission80-batch.mjs
          b5ff6847a105fbbb50756472865db7898265be41e26a1400073728fa4840dc43  tools/mission87-persist.mjs
          a5617b54f962ef91fc7d8aeca48b92c0652d01b5464664b4ac1e406a08e97a4f  tools/mission95-check-output.mjs
          4bd6d14ebfc600466be77b51d87198c8a94c0fe8303ebd9b71c8febdfcb286d2  tools/mission95-persist-ward.mjs
          HASHES
          sed -i 's/^ *//' "$RUNNER_TEMP/pin.sha256"
          wc -l "$RUNNER_TEMP/pin.sha256"
      - name: Verify pinned SHA, clean tree, file hashes (no token)
        run: |
          set -eu
          [ "$(git rev-parse HEAD)" = "$PIN_SHA" ] || { echo "FAIL: HEAD is not the pinned SHA"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "FAIL: tree not clean"; exit 1; }
          sha256sum -c "$RUNNER_TEMP/pin.sha256"
          echo "OK: pinned code verified"
      - name: Preflight (no token, no network)
        run: |
          set -eu
          printf '%s' "$WARD" | grep -Eq '^[a-z]+$' || { echo "FAIL: invalid ward"; exit 1; }
          [ "$DATA_REPO" = "masamasa26346497-eng/livecity-3d-data" ] || { echo "FAIL: unexpected data repo"; exit 1; }
          node -e '
            const fs=require("fs"); const w=process.env.WARD;
            const polys=JSON.parse(fs.readFileSync("data/processed/osaka-city/boundaries/ward-classification-polygons.json","utf8"));
            const hit=polys.wards.find(x=>x.wardId===w);
            if(!hit) throw new Error("ward not in N03 polygons: "+w);
            if(String(hit.wardCode).startsWith("27999")) throw new Error("expo (27999) excluded");
            if(!/^271[0-2]\d$/.test(String(hit.wardCode))) throw new Error("not an official Osaka City ward code: "+hit.wardCode);
            const lock=JSON.parse(fs.readFileSync("data/reports/mission79/source-lock.json","utf8"));
            if(!/plateau-27100-osaka-shi-2025/.test(JSON.stringify(lock.package))) throw new Error("source lock is not 27100/2025");
            if(!lock.license||!lock.attribution) throw new Error("license/attribution missing in source lock");
            const codes=new Set(polys.wards.map(x=>String(x.wardCode))); if(codes.size!==polys.wards.length) throw new Error("duplicate ward codes");
            console.log("preflight ok ward="+w+" code="+hit.wardCode+" cost=0 (public CDN range reads, free runner minutes, private repo release)");
          '
      - name: Connect check (read-only, curl only, no repo code)
        env:
          DATA_TOKEN: ${{ secrets.LIVECITY_3D_DATA_TOKEN }}
        run: |
          set -u
          if [ -z "$DATA_TOKEN" ]; then echo "FAIL: secret empty or missing"; exit 1; fi
          echo "::add-mask::$DATA_TOKEN"
          code=$(curl -sS -o /tmp/repo.json -w '%{http_code}' -H "Authorization: Bearer $DATA_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$DATA_REPO")
          [ "$code" = "200" ] || { echo "FAIL: repo GET HTTP $code"; exit 1; }
          vis=$(jq -r '.visibility' /tmp/repo.json); push=$(jq -r '.permissions.push // false' /tmp/repo.json)
          echo "repo=$DATA_REPO visibility=$vis token_push=$push"
          [ "$vis" = "private" ] && [ "$push" = "true" ] || { echo "FAIL: need private + push"; exit 1; }
          echo "OK: private connection verified (read-only)"
      - name: Resource preflight (no token, no download)
        run: |
          set -eu
          case "$WARD" in ikuno|abeno|yodogawa) ;; *) echo "FAIL: ward not allowed in Mission105: $WARD"; exit 1;; esac
          free_gb=$(df -BG --output=avail . | tail -n1 | tr -dc 0-9)
          mem_mb=$(free -m | awk '/^Mem:/ {print $2}')
          echo "free_disk_gb=$free_gb mem_mb=$mem_mb"
          [ "$free_gb" -ge 6 ] || { echo "FAIL: need >= 6 GB free disk (peak plan ~0.35 GB inflated + output)"; exit 1; }
          [ "$mem_mb" -ge 3000 ] || { echo "FAIL: need >= 3000 MB RAM"; exit 1; }
          node tools/mission104/chunked-run.mjs --ward "$WARD" --chunk-mb 300 --max-mb 1200 --dry-run
      - name: Convert ward in bounded chunks (PLATEAU 2025, NO token)
        id: convert
        run: node tools/mission105/chunked-batch.mjs --wards "$WARD" --chunk-mb 300 --max-mb 1200 --ward-timeout-min 80
      - name: Strict output check (no token)
        id: strict
        run: node tools/mission95-check-output.mjs "$WARD" | tee "$RUNNER_TEMP/strict.json"
      - name: Re-verify code hashes before token use (no token)
        id: reverify
        run: |
          set -eu
          [ "$(git rev-parse HEAD)" = "$PIN_SHA" ] || { echo "FAIL: HEAD changed"; exit 1; }
          sha256sum -c "$RUNNER_TEMP/pin.sha256"
          M=data/reports/mission80/batch-manifest.json
          bad=$(git status --porcelain | grep -vE '^\?\? (temp/|data/reports/mission80/)' | grep -vE "^ M $M\$" || true)
          [ -z "$bad" ] || { echo "FAIL: unexpected changes: $bad"; exit 1; }
          git show "HEAD:$M" > "$RUNNER_TEMP/manifest.head.json"
          MANIFEST_BASE="$RUNNER_TEMP/manifest.head.json" MANIFEST_NEW="$M" node -e '
            const fs=require("fs"); const w=process.env.WARD;
            const a=JSON.parse(fs.readFileSync(process.env.MANIFEST_BASE,"utf8")), b=JSON.parse(fs.readFileSync(process.env.MANIFEST_NEW,"utf8"));
            const same=(x,y)=>JSON.stringify(x)===JSON.stringify(y);
            if(b.mission!==a.mission||String(b.vintage)!==String(a.vintage)) throw new Error("manifest header changed");
            for(const k of Object.keys(a.wards||{})){ if(k!==w && !same(a.wards[k],b.wards[k])) throw new Error("other ward entry modified: "+k); }
            for(const k of Object.keys(b.wards||{})){ if(k!==w && !(k in a.wards)) throw new Error("unexpected new ward entry: "+k); }
            const DERIVED=["totals","lastRun","source","crossWardDuplicateIds"];
            const extra=Object.keys(b).filter(k=>!["mission","vintage","wards","updatedAt"].includes(k)&&!DERIVED.includes(k)&&!same(a[k],b[k]));
            if(extra.length) throw new Error("unexpected top-level keys changed: "+extra);
            const ok=Object.values(b.wards).filter(x=>x&&x.status==="ok"), fl=Object.values(b.wards).filter(x=>x&&x.status==="failed");
            if(b.totals!==undefined){ const t=b.totals, e={wardsOk:ok.length,wardsFailed:fl.length,buildings:ok.reduce((n,x)=>n+x.buildings,0),outBytes:ok.reduce((n,x)=>n+x.outBytes,0)};
              if(!same(t,e)) throw new Error("totals inconsistent with wards: "+JSON.stringify(t)+" vs "+JSON.stringify(e)); }
            if(b.lastRun!==undefined){ const r=b.lastRun;
              if(!r||typeof r!=="object"||!Number.isInteger(r.processed)||r.processed>1||r.failedNow!==0||typeof r.at!=="string"||Object.keys(r).some(k=>!["processed","failedNow","stoppedBy","at"].includes(k))) throw new Error("lastRun invalid: "+JSON.stringify(r)); }
            if(b.source!==undefined){ const L=JSON.parse(fs.readFileSync("data/reports/mission79/source-lock.json","utf8")), s=b.source;
              if(s.url!==(L.resource&&L.resource.url)||s.etag!==(L.http&&L.http.etag)||s.bytes!==(L.http&&L.http.contentLength)||s.lastModified!==(L.http&&L.http.lastModified)) throw new Error("manifest source differs from hash-verified source-lock"); }
            if(b.crossWardDuplicateIds!==undefined){ const d=b.crossWardDuplicateIds;
              if(!d||typeof d!=="object"||Array.isArray(d)||Object.values(d).some(v=>!Number.isInteger(v))) throw new Error("crossWardDuplicateIds invalid"); }
            if(!b.wards[w]) throw new Error("target ward entry missing");
            console.log("manifest diff ok: only wards."+w+" and updatedAt may differ");
          '
      - name: Persist to private repo (token only here) and verify sha256
        id: persist
        env:
          LIVECITY_3D_DATA_TOKEN: ${{ secrets.LIVECITY_3D_DATA_TOKEN }}
        run: |
          echo "::add-mask::$LIVECITY_3D_DATA_TOKEN"
          node tools/mission95-persist-ward.mjs --ward "$WARD" --repo "$DATA_REPO" --execute | tee "$RUNNER_TEMP/persist.json"
          node tools/mission87-persist.mjs status
          {
            echo "### $WARD"
            echo "- strict: \`$(cat "$RUNNER_TEMP/strict.json")\`"
            echo "- persist: \`$(tail -n1 "$RUNNER_TEMP/persist.json")\`"
            echo "- browserAccepted: 0 (storage only; Cesium acceptance NOT done)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write per-ward result (no token; separates generate failure from persist failure)
        if: always()
        env:
          O_CONVERT: ${{ steps.convert.outcome }}
          O_STRICT: ${{ steps.strict.outcome }}
          O_REVERIFY: ${{ steps.reverify.outcome }}
          O_PERSIST: ${{ steps.persist.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          if [ "$O_PERSIST" = "success" ]; then st=stored
          elif [ "$O_CONVERT" = "failure" ] || [ "$O_STRICT" = "failure" ]; then st=generate-failed
          elif [ "$O_REVERIFY" = "failure" ] || [ "$O_PERSIST" = "failure" ]; then st=persist-failed
          else st=incomplete; fi
          jq -n --arg ward "$WARD" --arg st "$st" --arg c "$O_CONVERT" --arg s "$O_STRICT" --arg r "$O_REVERIFY" --arg p "$O_PERSIST" '{ward:$ward,status:$st,convert:$c,strict:$s,reverify:$r,persist:$p}' > "$RUNNER_TEMP/res/result-$WARD.json"
          cat "$RUNNER_TEMP/res/result-$WARD.json"
      - name: Upload per-ward result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ env.WARD }}
          path: ${{ runner.temp }}/res/result-${{ env.WARD }}.json
          retention-days: 30
  summary:
    needs: [plan, rest]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download per-ward results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Aggregate (no token)
        env:
          STORED_BEFORE: ${{ needs.plan.outputs.stored }}
          REST_RESULT: ${{ needs.rest.result }}
        run: |
          set -u
          mkdir -p results
          n_stored_before=$(echo $STORED_BEFORE | wc -w)
          n_new=0; gen=""; per=""; inc=""
          for f in results/result-*.json; do
            [ -f "$f" ] || continue
            w=$(jq -r .ward "$f"); st=$(jq -r .status "$f")
            case "$st" in stored) n_new=$((n_new+1));; generate-failed) gen="$gen $w";; persist-failed) per="$per $w";; *) inc="$inc $w";; esac
          done
          {
            echo "### Mission105 3-ward run (STORAGE ONLY - browser acceptance 0)"
            echo "- already stored and sha256 re-verified before this run: $n_stored_before ($STORED_BEFORE)"
            echo "- newly generated and stored this run: $n_new"
            echo "- generate-failed (convert/strict check; nothing uploaded):${gen:- none}"
            echo "- persist-failed (re-verify/upload/sha256 check):${per:- none}"
            echo "- incomplete (cancelled/skipped mid-way):${inc:- none}"
            echo "- convert job result: $REST_RESULT"
            echo "- HTTP fetch, CI browser render and device acceptance are NOT done by this workflow"
            echo "- Resume: dispatch again with wards=ALL (or the failed ward ids) (stored wards are re-verified and skipped, failed wards retried once)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$gen$per$inc" ] || [ "$REST_RESULT" = "failure" ]; then exit 1; fi
