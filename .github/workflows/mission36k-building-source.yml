name: Mission 36K - Restore Osaka Building Coverage

on:
  push:
    branches:
      - feature/mission-36j-osaka-24ward-google-places-expansion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-building-source:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-36k-buildings]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync mission branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guard protected production HTML before Mission 36K
        shell: bash
        run: |
          set -euo pipefail
          sha256sum public/osaka_3d_buildings.html public/osaka_3d_buildings.fullward-v3.html > /tmp/mission36k-protected.sha256

      - name: Test range ZIP, B3DM, and ward extractor logic
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/mission36k-ward-building-manifest.test.js \
            tests/mission36k-b3dm-smoke.test.js \
            tests/mission36k-ward-building-extractor.test.js

      - name: Discover current Osaka PLATEAU building resources
        shell: bash
        run: |
          set -euo pipefail
          node tools/mission36k-discover-osaka-building-source.mjs

      - name: Probe 3D Tiles and MVT archive without full download
        shell: bash
        run: |
          set -euo pipefail
          node tools/mission36k-probe-plateau-runtime-zip.mjs

      - name: Build 24-ward building source manifest and smoke-fetch Sumiyoshi tileset
        shell: bash
        run: |
          set -euo pipefail
          node tools/mission36k-build-ward-building-manifest.mjs --smoke-ward=sumiyoshi

      - name: Range-fetch and validate one real Sumiyoshi B3DM geometry tile
        shell: bash
        run: |
          set -euo pipefail
          node tools/mission36k-smoke-b3dm.mjs --ward=sumiyoshi

      - name: Selectively extract a small real Sumiyoshi ward package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mission36k-ward-extract
          node tools/mission36k-fetch-ward-building-source.mjs \
            --ward=sumiyoshi \
            --lod=1 \
            --max-files=3 \
            --out=/tmp/mission36k-ward-extract

      - name: Validate 24-ward coverage and selective geometry extraction
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'public/map-data/osaka-city/buildings/manifest.json';
          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (m.wardCount !== 24) throw new Error(`wardCount=${m.wardCount}`);
          if (m.coverage?.lod1Wards !== 24) throw new Error(`lod1Wards=${m.coverage?.lod1Wards}`);
          if (Object.keys(m.wards || {}).length !== 24) throw new Error('manifest does not contain 24 ward records');
          for (const [id, w] of Object.entries(m.wards)) {
            if (!w.preferredLod1?.tilesetPath) throw new Error(`missing preferred LOD1 tileset: ${id}`);
            if (!(w.preferredLod1?.b3dmCount > 0)) throw new Error(`missing LOD1 B3DM geometry: ${id}`);
          }
          const r = JSON.parse(fs.readFileSync('data/reports/mission36k-building-ward-manifest.json', 'utf8'));
          if (r.smoke?.wardId !== 'sumiyoshi' || !r.smoke?.assetVersion) throw new Error('Sumiyoshi tileset range smoke failed');
          const b = JSON.parse(fs.readFileSync('data/reports/mission36k-b3dm-smoke.json', 'utf8'));
          if (!b.verified || b.header?.magic !== 'b3dm' || b.header?.glbMagic !== 'glTF') throw new Error('B3DM range smoke failed');
          const x = JSON.parse(fs.readFileSync('data/reports/mission36k-ward-extract-sumiyoshi-lod1.json', 'utf8'));
          if (x.wardId !== 'sumiyoshi' || x.lod !== 1 || x.mode !== 'limited') throw new Error('Ward extractor report identity failed');
          if (x.selectedFiles !== 3 || x.extracted?.length !== 3) throw new Error(`Unexpected extracted file count: ${x.selectedFiles}`);
          if (!x.extracted.some((e) => e.relativePath === 'tileset.json')) throw new Error('Extracted package lacks tileset.json');
          const b3dm = x.extracted.filter((e) => e.b3dm);
          if (!b3dm.length || b3dm.some((e) => e.b3dm.version !== 1 || e.b3dm.glbVersion !== 2)) throw new Error('Extracted B3DM/GLB validation failed');
          console.log(JSON.stringify({ coverage: m.coverage, b3dmSmoke: b, wardExtract: x }, null, 2));
          NODE

      - name: Upload selective Sumiyoshi extraction smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: mission36k-sumiyoshi-lod1-range-smoke
          path: /tmp/mission36k-ward-extract/sumiyoshi-lod1
          if-no-files-found: error
          retention-days: 7

      - name: Guard protected production HTML after Mission 36K
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/mission36k-protected.sha256

      - name: Commit Mission 36K source manifests and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/reports/mission36k-building-source-discovery.json \
            data/reports/mission36k-runtime-zip-probe.json \
            data/reports/mission36k-building-ward-manifest.json \
            data/reports/mission36k-b3dm-smoke.json \
            data/reports/mission36k-ward-extract-sumiyoshi-lod1.json \
            public/map-data/osaka-city/buildings/manifest.json
          if git diff --cached --quiet; then
            echo 'No Mission36K manifest changes.'
            exit 0
          fi
          git commit -m 'data(mission36k): verify selective ward building extraction'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
