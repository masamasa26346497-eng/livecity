name: Mission 36J - Bound Citywide Facility Rendering

on:
  push:
    branches:
      - feature/mission-36j-osaka-24ward-google-places-expansion
      - fix/mission-36j-building-click-performance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-dev-ui:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (contains(github.event.head_commit.message, '[run-36j-ui-perf]') ||
        contains(github.event.head_commit.message, '[run-36j-ui-perf-v2]')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout mission branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest mission branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply bounded facility renderer to dev UI only
        run: node tools/mission36j-patch-facility-performance.mjs

      - name: Apply non-blocking facility click picker
        run: node tools/mission36j-patch-building-click-performance-v2.mjs

      - name: Verify protected production HTML is not staged
        shell: bash
        run: |
          set -euo pipefail
          if git status --short -- public/osaka_3d_buildings.html public/osaka_3d_buildings.fullward-v3.html | grep -q .; then
            echo 'Protected production HTML changed unexpectedly.' >&2
            exit 1
          fi
          grep -q 'MAX_RENDERED_FACILITIES = 200' public/osaka_3d_buildings.ward-ux-v1.html
          grep -q 'FACILITY_RENDER_RADIUS_METERS = 2500' public/osaka_3d_buildings.ward-ux-v1.html
          grep -q "pickMode: 'screen-space-nearest'" public/osaka_3d_buildings.ward-ux-v1.html
          grep -q 'cs.tgt && Number.isFinite(cs.tgt.x)' public/osaka_3d_buildings.ward-ux-v1.html
          grep -q 'ward-manifest.json' public/osaka_3d_buildings.ward-ux-v1.html
          grep -q "areaId: 'osaka-city'" public/osaka_3d_buildings.ward-ux-v1.html
          grep -q 'google-places-osaka-city-mapping.json' public/osaka_3d_buildings.ward-ux-v1.html
          if sed -n '/const FacilityLayer = (function () {/,/^})();/p' public/osaka_3d_buildings.ward-ux-v1.html | grep -q 'facilityRaycaster.intersectObjects'; then
            echo 'FacilityLayer still uses sprite Raycaster picking.' >&2
            exit 1
          fi

      - name: Commit dev UI performance fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/osaka_3d_buildings.ward-ux-v1.html
          if git diff --cached --quiet; then
            echo 'No dev UI performance changes to commit.'
            exit 0
          fi
          git commit -m 'fix(mission36j): keep building picking responsive with facility culling'
          git push origin "HEAD:${GITHUB_REF_NAME}"
