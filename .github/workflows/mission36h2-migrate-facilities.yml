name: Mission 36H2 facility coordinate migration

# One-shot workflow used only to apply and verify the existing 149-record migration on GitHub.
on:
  push:
    branches:
      - feature/mission-36h2-facility-coordinate-normalization
    paths:
      - .github/workflows/mission36h2-migrate-facilities.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout mission branch
        uses: actions/checkout@v4
        with:
          ref: feature/mission-36h2-facility-coordinate-normalization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify coordinate implementation before migration
        run: node --test tests/mission36h2-facility-coordinate-normalization.test.js

      - name: Migrate all existing facility coordinates from lat/lon
        run: node tools/migrate-facility-coordinates-znorth-neg.js --area osaka-sumiyoshi

      - name: Verify migrated dataset
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'public/map-data/osaka-sumiyoshi/facilities/facilities.json';
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (d.coordinateConvention !== 'znorth-neg-v1') throw new Error('coordinateConvention mismatch');
          if (d.records.length !== 149) throw new Error(`recordCount mismatch: ${d.records.length}`);
          const t = d.records.find((r) => r.id === 'osm-node-750515219');
          if (!t) throw new Error('スーパー玉出 アビコ店 missing');
          if (t.localX !== -1591.3 || t.localZ !== 373.31) {
            throw new Error(`スーパー玉出 coordinate mismatch: ${t.localX}, ${t.localZ}`);
          }
          const CLAT = 34.604208, MPD = 111320;
          for (const r of d.records) {
            const expected = Math.round((-(r.latitude - CLAT) * MPD) * 100) / 100;
            if (Math.abs(expected - r.localZ) >= 0.001) {
              throw new Error(`${r.id}: localZ=${r.localZ}, expected=${expected}`);
            }
          }
          console.log(JSON.stringify({records:d.records.length, coordinateConvention:d.coordinateConvention, tamade:{localX:t.localX,localZ:t.localZ}}));
          NODE

      - name: Run bridge regression tests against migrated data
        run: node --test tests/mission36h2-facility-coordinate-normalization.test.js tests/mission36h-city-label-facility-bridge.test.js

      - name: Commit only migrated facility artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "livecity-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed/osaka-sumiyoshi/facilities/facilities.json
          git add public/map-data/osaka-sumiyoshi/facilities/facilities.json
          git add public/map-data/osaka-sumiyoshi/facilities/metadata.json
          if git diff --cached --quiet; then
            echo "No facility migration changes produced."
            exit 1
          fi
          git commit -m "Mission 36H2: migrate 149 facility coordinates to znorth-neg-v1"
          git push origin HEAD:feature/mission-36h2-facility-coordinate-normalization
