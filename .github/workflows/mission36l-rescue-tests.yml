
name: Mission 36L Rescue Tests

on:
  push:
    branches:
      - feature/mission-36l-building-photo-linking
    paths:
      - 'tools/google-places/**'
      - 'tests/mission36l-missing-facility-rescue-*.test.js'
      - 'tests/mission36l-places-error-diagnostics.test.js'
      - 'tests/mission36l-monthly-cost-guard.test.mjs'
      - 'tests/mission36l-paid-run-approval.test.mjs'
      - 'tests/mission36l-building-google-place-index-safety.test.mjs'
      - 'tools/photos/build-building-google-place-index.mjs'
      - 'public/livecity-building-photo-bridge.js'
      - 'tests/mission36l-browser-photo-cost-lock.test.mjs'
      - '.github/workflows/mission36l-rescue-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission36l-rescue-tests
  cancel-in-progress: true

jobs:
  rescue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run rescue unit tests (offline)
        run: >
          node --test
          tests/mission36l-missing-facility-rescue-api-errors.test.js
          tests/mission36l-missing-facility-rescue-resilience.test.js
          tests/mission36l-places-error-diagnostics.test.js
          tests/mission36l-monthly-cost-guard.test.mjs
          tests/mission36l-paid-run-approval.test.mjs
          tests/mission36l-building-google-place-index-safety.test.mjs
          tests/mission36l-browser-photo-cost-lock.test.mjs
