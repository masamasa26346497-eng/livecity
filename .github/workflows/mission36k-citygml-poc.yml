name: Mission 36K - CityGML Ward PoC

on:
  push:
    branches:
      - feature/mission-36j-osaka-24ward-google-places-expansion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-citygml:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-36k-citygml-poc]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync mission branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard protected production HTML
        shell: bash
        run: sha256sum public/osaka_3d_buildings.html public/osaka_3d_buildings.fullward-v3.html > /tmp/protected.sha256

      - name: Probe 2024 CityGML ZIP by HTTP Range
        shell: bash
        run: node tools/mission36k-probe-citygml-zip.mjs

      - name: Validate CityGML probe
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('data/reports/mission36k-citygml-zip-probe.json','utf8'));
          if (!r.zip?.rangeSupported) throw new Error('Range support missing');
          if (r.zip?.buildingGmlCount !== 270) throw new Error(`Unexpected building GML count: ${r.zip?.buildingGmlCount}`);
          if (r.zip?.meshCodeCount !== 270) throw new Error(`Unexpected mesh count: ${r.zip?.meshCodeCount}`);
          if (!(r.zip?.entriesParsed > 0)) throw new Error('No ZIP entries parsed');
          console.log(JSON.stringify({entries:r.zip.entriesParsed,gml:r.zip.gmlCount,buildingGml:r.zip.buildingGmlCount,meshCodes:r.zip.meshCodeCount}));
          NODE

      - name: Plan Sumiyoshi-only CityGML range selection
        shell: bash
        run: |
          set -euo pipefail
          node tools/mission36k-fetch-citygml-ward-range.mjs --ward=sumiyoshi --dry-run
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('data/reports/mission36k-citygml-range-sumiyoshi.json','utf8'));
          if (r.candidateEntries !== 15) throw new Error(`Unexpected Sumiyoshi mesh selection: ${r.candidateEntries}`);
          if (!(r.compressedBytes > 0 && r.uncompressedBytes > r.compressedBytes)) throw new Error('Invalid Sumiyoshi range byte plan');
          console.log(JSON.stringify({candidateEntries:r.candidateEntries,meshes:r.candidateMeshes,compressedMB:+(r.compressedBytes/1048576).toFixed(1),uncompressedMB:+(r.uncompressedBytes/1048576).toFixed(1)}));
          NODE

      - name: Range-extract three real Sumiyoshi-overlapping building GML files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mission36k-citygml-sumiyoshi
          node tools/mission36k-fetch-citygml-ward-range.mjs \
            --ward=sumiyoshi \
            --max-files=3 \
            --out=/tmp/mission36k-citygml-sumiyoshi
          test "$(find /tmp/mission36k-citygml-sumiyoshi -maxdepth 1 -type f -name '*.gml' | wc -l)" -eq 3
          grep -q '<bldg:Building' /tmp/mission36k-citygml-sumiyoshi/*.gml

      - name: Convert sample CityGML directly to Live City canonical runtime coordinates
        shell: bash
        run: |
          set -euo pipefail
          node tools/mission36k-convert-citygml-runtime.mjs \
            --input /tmp/mission36k-citygml-sumiyoshi \
            --output /tmp/mission36k-sumiyoshi-sample.jsonl \
            --ward-hint sumiyoshi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lines = fs.readFileSync('/tmp/mission36k-sumiyoshi-sample.jsonl','utf8').trim().split('\n').filter(Boolean);
          if (lines.length < 100) throw new Error(`Too few converted buildings: ${lines.length}`);
          let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
          for (const line of lines.slice(0, 5000)) {
            const b = JSON.parse(line);
            if (b.coordinateConvention !== 'znorth-neg-v1') throw new Error('coordinate convention mismatch');
            if (!Array.isArray(b.fp) || b.fp.length < 3 || !(b.h > 0)) throw new Error('invalid converted building');
            for (const [x,z] of b.fp) {
              if (!Number.isFinite(x) || !Number.isFinite(z) || Math.abs(x) > 30000 || Math.abs(z) > 30000) throw new Error(`suspicious runtime coordinate ${x},${z}`);
              minX=Math.min(minX,x); maxX=Math.max(maxX,x); minZ=Math.min(minZ,z); maxZ=Math.max(maxZ,z);
            }
          }
          console.log(JSON.stringify({converted:lines.length,sampleBounds:{minX,maxX,minZ,maxZ}}));
          NODE
          sha256sum -c /tmp/protected.sha256

      - name: Upload Sumiyoshi CityGML and converted sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: mission36k-sumiyoshi-citygml-runtime-sample
          path: |
            /tmp/mission36k-citygml-sumiyoshi
            /tmp/mission36k-sumiyoshi-sample.jsonl
            /tmp/mission36k-sumiyoshi-sample.report.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit probe and ward-range reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/reports/mission36k-citygml-zip-probe.json \
            data/reports/mission36k-citygml-range-sumiyoshi.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(mission36k): validate canonical Sumiyoshi runtime conversion'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
