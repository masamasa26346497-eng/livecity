# Mission 213 QA workflow【適用待ち・未実行】
# ここ(docs/mission213/)は提案置き場です。GitHub App に workflow 権限が無いため、Claude は
# .github/workflows/ へ push できません。適用手順は docs/mission213/QA_UNBLOCK.md を参照。
# 適用先: .github/workflows/mission213-qa.yml (PR #68 ブランチ claude/issue-67-20261114-1354 のみ)
#
# 設計:
#  - workflow_dispatch のみ(push/schedule では動かない=無料枠の無駄打ちなし)。secrets 不使用。
#  - 各 step は前景・同期。exit code が Actions に記録される(background/orphan cleanup 問題なし)。
#  - ジョブ全体 55 分上限。ビルド側は既存ガード(38分/6GB/空きディスク)がそのまま効く。
#  - artifact は集計 JSON(qa.json)のみ。PLATEAU 原データ/GLB/ビルド出力は上げない。
#  - 結果は PR #68 へ GITHUB_TOKEN で自動コメント(Claude の App トークン 1時間失効に依存しない)。
name: mission213-qa
on:
  workflow_dispatch:
    inputs:
      max_points: { description: 'sweep 最大点数', default: '8' }
      alts:       { description: '高度(m,カンマ区切り)', default: '3000,10000' }
      budget_min: { description: 'sweep 壁時計予算(分)', default: '15' }
permissions:
  contents: read
  pull-requests: write   # PR #68 へ結果コメントを投稿するためだけに使用
concurrency:
  group: mission213-qa
  cancel-in-progress: false
jobs:
  qa:
    if: github.ref == 'refs/heads/claude/issue-67-20261114-1354'   # PR #68 ブランチ以外では実行しない
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Guard (disk / chrome / node)
        run: |
          df -h .
          node --version
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          test -n "$CHROME" || { echo "chrome/chromium が無い"; exit 1; }
          "$CHROME" --version

      - name: Unit tests (fixture, no network)
        run: node --test tests/mission213-city-lod0.test.cjs tests/cloud-ward-plan.test.cjs

      - name: Build 24 wards + LOD0 (official PLATEAU 2025; guards 38min/6GB)
        id: build
        run: |
          set -o pipefail
          start=$(date +%s)
          node tools/cloud/build-cloud-preview.mjs --all-wards --city-lod0 --out temp/cloud-all 2>&1 | tail -n 200 | tee temp-build.log
          echo "build_sec=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          du -sm temp/cloud-all | tee build-size.txt

      - name: Sweep E2E (real Chromium + SwiftShader, read-only on build output)
        id: sweep
        run: |
          node tools/cloud/e2e-city-lod0.mjs --static temp/cloud-all --chrome "$CHROME" \
            --sweep --alts "${{ inputs.alts }}" --budget-min "${{ inputs.budget_min }}" \
            --max-points "${{ inputs.max_points }}" --out temp/qa.json

      - name: Summarize (read-only, aggregates only)
        if: always()
        run: |
          {
            echo "### Mission213 QA (run ${{ github.run_id }}, sha ${{ github.sha }})"
            echo "- build: ${{ steps.build.outcome }} (${{ steps.build.outputs.build_sec }}s)  sweep: ${{ steps.sweep.outcome }}"
            echo "- build size MB: $(cut -f1 build-size.txt 2>/dev/null || echo n/a)"
            if [ -f temp/qa.json ]; then
              node -e "const r=require('./temp/qa.json');const s=r.sweep||{};console.log('- coverage: '+JSON.stringify(r.coverage));console.log('- sweep summary: '+JSON.stringify(s.summary)+' truncated='+s.truncated+' wardsFound='+s.wardsFound);console.log('\n| kind | ward | alt | lod0Share | loaded | status |\n|---|---|---|---|---|---|');for(const w of (s.rows||[]))console.log('| '+[w.kind,w.ward,w.alt,w.lod0Share,w.loaded,w.status].join(' | ')+' |')"
            else echo "- qa.json なし(build か e2e が失敗)"; fi
            echo; echo "※ headless SwiftShader の値であり実機性能ではありません。24区全域の完成判定は sweep が打ち切り無し(truncated 無し)かつ hole 0 のときのみ。"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR #68
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh pr comment 68 --repo "${{ github.repository }}" --body-file summary.md || echo "comment failed (non-fatal)"

      - name: Upload aggregate JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission213-qa-aggregate
          path: |
            temp/qa.json
            summary.md
          retention-days: 7
          if-no-files-found: ignore
