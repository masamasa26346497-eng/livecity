<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Mission 37B — CesiumJS × Live City 既存建物タイル POC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Mission 37B POC（本番HTMLとは独立。osaka_3d_buildings*.html は一切変更しない）
  - Google Map Tiles API / Photorealistic 3D Tiles / Cesium ion は不使用（APIキー不要）
  - 既存 public/map-data/osaka-city/buildings/{dataset}/ の tile JSON をそのまま fetch（コピー・再生成なし）
  - 座標: znorth-neg-v1 (meters-local) → WGS84。geoToThree() (osaka_3d_buildings.html) の厳密な逆変換
      x = (lon - CLON) * cos(CLAT) * MPD ,  z = -((lat - CLAT) * MPD)
  - canonicalId = tile JSON の building.id（"bldg_<uuid>"）をそのまま GeometryInstance.id に保持（新体系なし）
  - 方式: 1 tile = 1 Cesium Primitive（全 GeometryInstance をバッチ）。後で 3D Tiles(b3dm/glTF) 化する際も
          「tile 単位 = tileset の 1 content」としてそのまま対応づけられる。
  URL params: ?dataset=osaka-sumiyoshi&tx0=-6&tx1=-4&tz0=-3&tz1=-1&imagery=0|1
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.1/Build/Cesium/Widgets/widgets.css">
<style>
  html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1220; }
  #hud { position: absolute; top: 8px; left: 8px; z-index: 10; padding: 8px 10px; background: rgba(8,12,20,.82);
         color: #dfe8f5; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; border-radius: 6px; min-width: 270px; pointer-events: auto; }
  #hud h1 { font-size: 12px; margin: 0 0 4px; color: #8fd0ff; }
  #hud .k { color: #8aa0b8; display: inline-block; min-width: 130px; }
  #hud button { margin-top: 6px; font: inherit; cursor: pointer; }
  #picked { margin-top: 6px; padding-top: 6px; border-top: 1px solid #2a3a50; word-break: break-all; color: #ffd37a; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="hud">
  <h1>Mission 37B · Cesium × Live City tiles</h1>
  <div><span class="k">状態</span><span id="h-status">loading…</span></div>
  <div><span class="k">FPS (1s平均)</span><span id="h-fps">-</span></div>
  <div><span class="k">FPS (最小/最大)</span><span id="h-fps-mm">-</span></div>
  <div><span class="k">描画建物数</span><span id="h-bldg">0</span></div>
  <div><span class="k">読込タイル数</span><span id="h-tiles">0</span></div>
  <div><span class="k">Primitive数</span><span id="h-prims">0</span></div>
  <div><span class="k">footprint頂点数</span><span id="h-verts">0</span></div>
  <div><span class="k">初期ロード時間</span><span id="h-load">-</span></div>
  <div><span class="k">　fetch/parse</span><span id="h-fetch">-</span></div>
  <div><span class="k">　Primitive ready</span><span id="h-ready">-</span></div>
  <div><span class="k">JS heap</span><span id="h-heap">n/a</span></div>
  <div><span class="k">スキップ(不正fp)</span><span id="h-skip">0</span></div>
  <div><span class="k">モード</span><span id="h-mode">-</span></div>
  <div><span class="k">10秒計測</span><span id="h-measure">-</span></div>
  <button id="btn-measure">10秒FPS計測</button>
  <button id="btn-reset">カメラ初期位置に戻す</button>
  <div id="picked">建物をクリック → canonicalId</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.1/Build/Cesium/Cesium.js"></script>
<script>
(function () {
  'use strict';
  const T0 = performance.now();

  // ── 既存 geoToThree()（osaka_3d_buildings.html）と同一定数。変更禁止 ──
  const SEARCH_CLAT = 34.604208, SEARCH_CLON = 135.525020, SEARCH_MPD = 111320;
  const COS_CLAT = Math.cos(SEARCH_CLAT * Math.PI / 180);
  const localToLon = (x) => SEARCH_CLON + x / (COS_CLAT * SEARCH_MPD);
  const localToLat = (z) => SEARCH_CLAT - z / SEARCH_MPD; // znorth-neg-v1: 北 = -Z

  const q = new URLSearchParams(location.search);
  const DATASET = q.get('dataset') || 'osaka-sumiyoshi';
  // 既定: 住吉区の最密 3×3 tile ブロック（x:-3000..-1500m, z:-1500..0m, 約10.5k棟, 9 tile）
  const BLOCK = {
    tx0: +(q.get('tx0') ?? -6), tx1: +(q.get('tx1') ?? -4),
    tz0: +(q.get('tz0') ?? -3), tz1: +(q.get('tz1') ?? -1),
  };
  const MODE = ['fixed', 'all', 'dynamic'].includes(q.get('mode')) ? q.get('mode') : 'fixed';
  const DYN_R = +(q.get('r') ?? 1); // dynamic: 注視 tile からの Chebyshev 半径（1 → 最大 3×3 tile）
  const BASE = 'map-data/osaka-city/buildings/' + DATASET + '/';

  // ── Cesium viewer（ion / Google 不使用）──
  const viewer = new Cesium.Viewer('cesiumContainer', {
    baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false,
    sceneModePicker: false, navigationHelpButton: false, animation: false, timeline: false,
    fullscreenButton: false, infoBox: false, selectionIndicator: false, requestRenderMode: false,
  });
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#1c2733');
  viewer.scene.globe.depthTestAgainstTerrain = false;
  if (q.get('imagery') !== '0') {
    // キー不要の OSM ラスタ（比較時の位置確認用。?imagery=0 で無効化）
    viewer.imageryLayers.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' }));
  }
  viewer.scene.debugShowFramesPerSecond = false;

  // ── カメラ初期位置（固定。Three.js 版比較用）──
  // ブロック中心を注視、heading=0(北上) / pitch=-45° / range=1500m
  const cx = ((BLOCK.tx0 + BLOCK.tx1 + 1) / 2) * 500;
  const cz = ((BLOCK.tz0 + BLOCK.tz1 + 1) / 2) * 500;
  // ロード完了後は、実際に読み込んだ footprint の WGS84 範囲(ext)から中心/距離を再計算する
  let CENTER = Cesium.Cartesian3.fromDegrees(localToLon(cx), localToLat(cz), 0);
  let RANGE = 1500;
  const CAM = { heading: 0, pitch: Cesium.Math.toRadians(-45) };
  function resetCamera() {
    viewer.camera.lookAt(CENTER, new Cesium.HeadingPitchRange(CAM.heading, CAM.pitch, RANGE));
    viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY); // 解除して自由操作可能にする
  }
  resetCamera();
  document.getElementById('btn-reset').onclick = resetCamera;

  // ── stats / HUD ──
  const stats = {
    dataset: DATASET, block: BLOCK, mode: MODE, dynR: DYN_R, tilesLoadedTotal: 0, tilesUnloadedTotal: 0, dynLog: [], measure: null, tiles: 0, buildings: 0, primitives: 0, vertices: 0, skipped: 0,
    fetchParseMs: null, primitivesReadyMs: null, initialLoadMs: null, fps: 0, fpsMin: null, fpsMax: null,
    lastPickedCanonicalId: null, status: 'loading',
  };
  window.__mission37b = stats;
  const $ = (id) => document.getElementById(id);
  function renderHud() {
    $('h-status').textContent = stats.status;
    $('h-mode').textContent = MODE + (MODE === 'dynamic' ? ' r=' + DYN_R + ' (+' + stats.tilesLoadedTotal + '/-' + stats.tilesUnloadedTotal + ')' : '');
    $('h-bldg').textContent = stats.buildings;
    $('h-tiles').textContent = stats.tiles;
    $('h-prims').textContent = stats.primitives;
    $('h-verts').textContent = stats.vertices;
    $('h-skip').textContent = stats.skipped;
    if (stats.fetchParseMs != null) $('h-fetch').textContent = stats.fetchParseMs.toFixed(0) + ' ms';
    if (stats.primitivesReadyMs != null) $('h-ready').textContent = stats.primitivesReadyMs.toFixed(0) + ' ms';
    if (stats.initialLoadMs != null) $('h-load').textContent = stats.initialLoadMs.toFixed(0) + ' ms';
    if (performance.memory) $('h-heap').textContent = (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + ' MB';
  }

  // FPS: postRender 間隔から 1 秒窓の平均 / 最小 / 最大を算出
  let frames = 0, winStart = performance.now(), mn = Infinity, mx = 0;
  viewer.scene.postRender.addEventListener(() => {
    frames++;
    const now = performance.now();
    if (now - winStart >= 1000) {
      const fps = frames * 1000 / (now - winStart);
      stats.fps = +fps.toFixed(1);
      mn = Math.min(mn, fps); mx = Math.max(mx, fps);
      stats.fpsMin = +mn.toFixed(1); stats.fpsMax = +mx.toFixed(1);
      $('h-fps').textContent = stats.fps.toFixed(1);
      $('h-fps-mm').textContent = stats.fpsMin + ' / ' + stats.fpsMax;
      frames = 0; winStart = now;
      renderHud();
    }
  });

  // ── 建物色（高さ帯。見た目比較用の簡易スタイル）──
  function colorFor(h) {
    const t = Math.min(h / 60, 1);
    return Cesium.Color.fromBytes(Math.round(190 - 70 * t), Math.round(200 - 50 * t), Math.round(215 - 20 * t), 255);
  }
  const HILITE = Cesium.Color.fromCssColorString('#ff9f1c');

  // footprint(ローカル m) → Cartesian3 flat degrees。連続重複点・閉じ点を除去
  function footprintToDegrees(fp) {
    const out = [];
    let px = null, pz = null;
    for (const p of fp) {
      if (p[0] === px && p[1] === pz) continue;
      out.push(localToLon(p[0]), localToLat(p[1]));
      px = p[0]; pz = p[1];
    }
    const n = out.length;
    if (n >= 6 && out[0] === out[n - 2] && out[1] === out[n - 1]) { out.pop(); out.pop(); }
    return out.length >= 6 ? out : null;
  }

  const ext = { w: Infinity, e: -Infinity, s: Infinity, n: -Infinity }; // 実読込 footprint の WGS84 範囲

  function buildTilePrimitive(tile, info) {
    const instances = [];
    for (const b of tile.buildings) {
      const deg = footprintToDegrees(b.fp);
      if (!deg) { info.skipped++; continue; }
      const z0 = b.z0 || 0;
      const top = z0 + (b.dz || b.h || 3);
      instances.push(new Cesium.GeometryInstance({
        id: b.id, // canonicalId をそのまま保持
        geometry: new Cesium.PolygonGeometry({
          polygonHierarchy: new Cesium.PolygonHierarchy(Cesium.Cartesian3.fromDegreesArray(deg)),
          height: z0, extrudedHeight: top,
          vertexFormat: Cesium.PerInstanceColorAppearance.FLAT_VERTEX_FORMAT,
        }),
        attributes: { color: Cesium.ColorGeometryInstanceAttribute.fromColor(colorFor(b.h || top - z0)) },
      }));
      info.verts += b.fp.length;
      for (let i = 0; i < deg.length; i += 2) {
        if (deg[i] < ext.w) ext.w = deg[i];
        if (deg[i] > ext.e) ext.e = deg[i];
        if (deg[i + 1] < ext.s) ext.s = deg[i + 1];
        if (deg[i + 1] > ext.n) ext.n = deg[i + 1];
      }
    }
    return new Cesium.Primitive({
      geometryInstances: instances,
      // flat: 太陽光(夜間は暗転)に依存せず色を出す。closed:false で面の向きによるカリングを避ける
      appearance: new Cesium.PerInstanceColorAppearance({ flat: true, translucent: false, closed: false, faceForward: true }),
      allowPicking: true, asynchronous: true, releaseGeometryInstances: false, // 色変更(ハイライト)に属性参照が必要
    });
  }

  // ── タイル管理（key "tx_tz" → {prim, count, verts, skipped}）──
  // mode=fixed(既定): BLOCK の固定タイル / all: manifest 全タイル / dynamic: カメラ注視点周辺のみ動的ロード・破棄
  const tileState = new Map();
  const pending = new Set();
  let manifestTiles = [];
  const TILE = 500;
  function recount() {
    let tiles = 0, bl = 0, v = 0, sk = 0;
    for (const s of tileState.values()) { tiles++; bl += s.count; v += s.verts; sk += s.skipped; }
    stats.tiles = tiles; stats.primitives = tiles; stats.buildings = bl; stats.vertices = v; stats.skipped = sk;
  }
  async function loadTile(t) {
    const key = t.tx + '_' + t.tz;
    if (tileState.has(key) || pending.has(key)) return null;
    pending.add(key);
    try {
      const t0 = performance.now();
      const tile = await (await fetch(BASE + t.file)).json();
      const info = { count: tile.buildings.length, verts: 0, skipped: 0, prim: null, loadedAt: t0 };
      info.prim = buildTilePrimitive(tile, info);
      viewer.scene.primitives.add(info.prim);
      tileState.set(key, info);
      stats.tilesLoadedTotal++;
      recount();
      return info;
    } finally { pending.delete(key); }
  }
  function unloadTile(key) {
    const s = tileState.get(key);
    if (!s) return;
    if (lastPrim === s.prim) { lastPrim = lastId = lastColor = null; }
    viewer.scene.primitives.remove(s.prim); // remove は destroy も行う（GPU 解放）
    tileState.delete(key);
    stats.tilesUnloadedTotal++;
    recount();
  }
  const whenReady = (prims) => new Promise((resolve) => {
    const rm = viewer.scene.postRender.addEventListener(() => {
      if (prims.every(p => p.ready)) { rm(); resolve(); }
    });
  });

  // カメラ注視点（画面中心の地表点。取れなければカメラ直下）→ ローカル m → tile index
  function focusTile() {
    const c = viewer.scene.canvas;
    let pos = viewer.camera.pickEllipsoid(new Cesium.Cartesian2(c.clientWidth / 2, c.clientHeight / 2), viewer.scene.globe.ellipsoid);
    const carto = Cesium.Cartographic.fromCartesian(pos || viewer.camera.positionWC);
    const lon = Cesium.Math.toDegrees(carto.longitude), lat = Cesium.Math.toDegrees(carto.latitude);
    const x = (lon - SEARCH_CLON) * COS_CLAT * SEARCH_MPD, z = -((lat - SEARCH_CLAT) * SEARCH_MPD);
    return { tx: Math.floor(x / TILE), tz: Math.floor(z / TILE) };
  }
  // 動的: 注視 tile から Chebyshev 距離 R 以内をロード、R+1 超を破棄（ヒステリシス 1）
  let dynBusy = false;
  async function updateDynamic() {
    if (dynBusy || stats.status !== 'ready') return;
    dynBusy = true;
    try {
      const f = focusTile(); stats.focusTile = f.tx + '_' + f.tz;
      const R = DYN_R;
      for (const key of [...tileState.keys()]) {
        const [tx, tz] = key.split('_').map(Number);
        if (Math.max(Math.abs(tx - f.tx), Math.abs(tz - f.tz)) > R + 1) unloadTile(key);
      }
      const want = manifestTiles.filter(t => Math.max(Math.abs(t.tx - f.tx), Math.abs(t.tz - f.tz)) <= R);
      const t0 = performance.now();
      const loaded = (await Promise.all(want.map(loadTile))).filter(Boolean);
      if (loaded.length) {
        await whenReady(loaded.map(s => s.prim));
        const ms = performance.now() - t0;
        stats.dynLog.push({ focus: stats.focusTile, loaded: loaded.length, ms: Math.round(ms), tilesNow: stats.tiles, buildingsNow: stats.buildings });
        if (stats.dynLog.length > 50) stats.dynLog.shift();
      }
    } catch (e) { console.error(e); } finally { dynBusy = false; renderHud(); }
  }

  async function load() {
    const manifest = await (await fetch(BASE + 'manifest.json')).json();
    if (manifest.coordinateConvention !== 'znorth-neg-v1') throw new Error('coordinateConvention=' + manifest.coordinateConvention);
    manifestTiles = manifest.tiles;
    stats.manifestTiles = manifestTiles.length; stats.manifestBuildings = manifest.totalBuildings;
    let want;
    if (MODE === 'all') want = manifestTiles;
    else if (MODE === 'dynamic') { const f = focusTile(); want = manifestTiles.filter(t => Math.max(Math.abs(t.tx - f.tx), Math.abs(t.tz - f.tz)) <= DYN_R); }
    else want = manifestTiles.filter(t => t.tx >= BLOCK.tx0 && t.tx <= BLOCK.tx1 && t.tz >= BLOCK.tz0 && t.tz <= BLOCK.tz1);
    const loaded = (await Promise.all(want.map(loadTile))).filter(Boolean);
    stats.fetchParseMs = performance.now() - T0;
    // 全 Primitive の async ジオメトリ生成(WebWorker)完了待ち
    const tReady0 = performance.now();
    const prims = loaded.map(s => s.prim);
    await whenReady(prims);
    stats.primitivesReadyMs = performance.now() - tReady0;
    stats.initialLoadMs = performance.now() - T0;
    // 実データ範囲からカメラを再設定。赤枠は建物範囲の診断用輪郭（建物が描画されなくても位置整合を目視できる）
    if (isFinite(ext.w) && MODE !== 'dynamic') {
      CENTER = Cesium.Cartesian3.fromDegrees((ext.w + ext.e) / 2, (ext.s + ext.n) / 2, 0);
      RANGE = Math.max(600, Math.hypot((ext.e - ext.w) * COS_CLAT * SEARCH_MPD, (ext.n - ext.s) * SEARCH_MPD) * 1.1);
      stats.extentDeg = ext; stats.cameraRange = Math.round(RANGE);
      viewer.entities.add({ polyline: {
        positions: Cesium.Cartesian3.fromDegreesArray([ext.w, ext.s, ext.e, ext.s, ext.e, ext.n, ext.w, ext.n, ext.w, ext.s]),
        width: 3, material: Cesium.Color.RED } });
      resetCamera();
    }
    stats.primitiveShown = prims.every(p => p.show);
    stats.boundingSphereRadii = prims.map(p => p.boundingSphere ? Math.round(p.boundingSphere.radius) : null);
    stats.status = 'ready';
    if (typeof performance.memory !== 'undefined') stats.heapMBAfterLoad = +(performance.memory.usedJSHeapSize / 1048576).toFixed(1);
    if (MODE === 'dynamic') {
      // カメラ操作終了時 + 2 秒周期（ズーム/慣性移動の取りこぼし対策）で更新
      viewer.camera.moveEnd.addEventListener(updateDynamic);
      setInterval(updateDynamic, 2000);
    }
    renderHud();
    console.log('[Mission37B] ready', JSON.stringify(stats));
  }
  // FPS 計測: 10 秒間の postRender 間隔から平均/最小/最大(フレーム間隔ベース)/p95 frame ms を算出 → stats.measure
  $('btn-measure').onclick = () => {
    const ts = []; let last = performance.now(); const t0 = last;
    $('h-measure').textContent = '計測中 10s…';
    const rm = viewer.scene.postRender.addEventListener(() => {
      const n = performance.now(); ts.push(n - last); last = n;
      if (n - t0 >= 10000) {
        rm();
        const sorted = ts.slice().sort((a, b) => a - b);
        const avgMs = ts.reduce((a, b) => a + b, 0) / ts.length;
        stats.measure = {
          durationMs: Math.round(n - t0), frames: ts.length, avgFps: +(1000 / avgMs).toFixed(1),
          p95FrameMs: +sorted[Math.floor(sorted.length * 0.95)].toFixed(1), maxFrameMs: +sorted[sorted.length - 1].toFixed(1),
          mode: MODE, tiles: stats.tiles, buildings: stats.buildings, primitives: stats.primitives,
          heapMB: performance.memory ? +(performance.memory.usedJSHeapSize / 1048576).toFixed(1) : null,
        };
        $('h-measure').textContent = stats.measure.avgFps + ' fps / p95 ' + stats.measure.p95FrameMs + ' ms';
        console.log('[Mission37B] measure', JSON.stringify(stats.measure));
      }
    });
  };
  load().catch((e) => { stats.status = 'error: ' + e.message; renderHud(); console.error(e); });

  // ── canonicalId クリック取得 + ハイライト ──
  let lastPrim = null, lastId = null, lastColor = null;
  const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  handler.setInputAction((click) => {
    if (lastPrim && lastId && !lastPrim.isDestroyed()) {
      const a = lastPrim.getGeometryInstanceAttributes(lastId);
      if (a) a.color = lastColor;
      lastPrim = lastId = lastColor = null;
    }
    const picked = viewer.scene.pick(click.position);
    // canonicalId = "bldg_<uuid>"（GeometryInstance.id）。赤枠 Entity 等は id が Entity なので除外される
    if (Cesium.defined(picked) && typeof picked.id === 'string' && /^bldg_/.test(picked.id)) {
      const a = picked.primitive.getGeometryInstanceAttributes(picked.id);
      if (a) { lastColor = a.color.slice(); a.color = Cesium.ColorGeometryInstanceAttribute.toValue(HILITE); lastPrim = picked.primitive; lastId = picked.id; }
      stats.lastPickedCanonicalId = picked.id;
      $('picked').textContent = 'canonicalId: ' + picked.id;
      console.log('[Mission37B] picked canonicalId =', picked.id);
    } else {
      stats.lastPickedCanonicalId = null;
      $('picked').textContent = '(建物なし)';
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
})();
</script>
</body>
</html>
