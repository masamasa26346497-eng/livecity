<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Live City 24区 建物＋道路＋河川（Mission 135・ローカル専用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.1/Build/Cesium/Widgets/widgets.css">
<style>
  html, body { margin: 0; height: 100%; background: #050a18; color: #eef1f3; font: 13px/1.5 system-ui, sans-serif; }
  #cesiumContainer { position: absolute; inset: 0; }
  #panel { position: absolute; top: 8px; left: 8px; z-index: 5; background: rgba(5,10,24,.88); padding: 8px 10px; border-radius: 6px; min-width: 300px; max-width: 360px; }
  #panel label { display: block; }
  .row { margin: 3px 0; }
  .st { font-size: 12px; color: #9cb8d8; }
  .st.ready { color: #8fd48f; } .st.missing { color: #ffb86b; } .st.error { color: #ff7b7b; } .st.loading { color: #8fc0ff; }
  #notice { color: #ffb86b; white-space: pre-wrap; margin-top: 4px; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="panel">
  <div class="row"><b>Live City 24区</b>（ローカル 127.0.0.1 専用）</div>
  <div class="row"><select id="ward"></select></div>
  <div class="row"><label><input type="checkbox" id="t-buildings" checked> 建物</label><span id="s-buildings" class="st">-</span></div>
  <div class="row"><label><input type="checkbox" id="t-roads" checked> 道路</label><span id="s-roads" class="st">-</span></div>
  <div class="row"><label><input type="checkbox" id="t-waterLine" checked> 河川（線）</label><span id="s-waterLine" class="st">-</span></div>
  <div class="row"><label><input type="checkbox" id="t-waterArea" checked> 河川（面・水面）</label><span id="s-waterArea" class="st">-</span></div>
  <div id="notice"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.1/Build/Cesium/Cesium.js"></script>
<script src="mission135-ward-viewer.js"></script>
</body>
</html>
